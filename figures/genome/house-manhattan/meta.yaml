# Simulated data: a 12-chromosome genome (rice/tomato-like), 6,000 SNPs.
title: Manhattan plot with chrom12 colours (house style)
title_zh: chrom12 配色曼哈顿图（house 风格）
slug: house-manhattan
category: genome
tags:
  - gwas
  - manhattan
  - bonferroni
  - chrom12-palette
  - house-style
packages:
  - ggplot2
data_columns:
  chr: 染色体编号（整数，1–12）
  pos_mb: 位置（Mb）
  neg_log10_p: −log10 P
when_to_use: 'Use this for a 4x1 layout measuring 183 x 43 mm with 7 or 8 pt text. The dataset includes 12 chromosomes and 6,000 SNPs. The Bonferroni threshold is 0.05 / 6,000, which equals 8.33 x 10^-6. The -log10 P threshold is 5.079, displayed as -log10 P = 5.08. There are 47 significant SNPs, with peaks on chr3 and chr8. Place the threshold label above the left end of the dashed line. The upper y limit is the highest peak plus 0.8. Place a single-line footnote inside the figure, below the plot box. The lead SNP is a red diamond with a black outline, twice the normal point size. Label the lead SNP as "chrN lead SNP". The data represents a simulated 12-chromosome genome like rice or tomato. The in-plot footnote uses 7 pt text. The footnote reads: "Simulated 12-chromosome genome (rice/tomato-like). Simulated data for illustration; not biological results". The data.csv file is 88 KB, remaining well under the 200 KB limit.'
customize: 'The threshold is calculated dynamically from the data.csv row count. This ensures the threshold updates automatically when data changes. Adjust inter-chromosome spacing using the GAP_MB variable. Map colors by chromosome number using pv_palette("chrom12"). Using more than 12 chromosomes throws an error and requires a different color scheme.'
lang: R
style: house
cells: 4x1
