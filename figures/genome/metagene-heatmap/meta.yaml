data_columns:
  gene: 基因 ID
  cluster: 分簇（按出现顺序上下排）
  bin_mid: 相对 TSS 的 bin 中点（bp）
  signal: 归一化信号
when_to_use: 看一组区域（TSS、峰中心）周围的信号分布时用：上方是各簇平均曲线并直接标簇名与基因数，下方热图每行一个基因，簇内按平均信号从高到低排，色条放在热图框内右下角。
customize: 改 `plot.py` 顶部参数块后在本目录运行 `python3 plot.py`；换数据时按列名替换 `data.csv`（`make_data.py` 用固定种子生成模拟数据）。常改项：`clusters`（簇名与颜色）、`vmax_q`（色标上限分位数）。
