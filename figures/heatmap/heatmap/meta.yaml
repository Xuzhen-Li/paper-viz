title: Clustered expression heatmap
title_zh: 聚类表达热图
slug: heatmap
category: heatmap
tags:
  - heatmap
  - clustering
  - expression
packages:
  - ggplot2
data_columns:
  gene: 行特征名（字符串）
  sample: 列样本名（字符串）
  value: 格子里的数值，通常是标准化表达（数值）
  group: 样本分组（字符串，随样本重复）
when_to_use: 基因对样本的矩阵要同时看模块和样本顺序时用。
customize: 配色用 pv_palette("diverging")；行列是否聚类由 plot.R 的 hclust 决定，删掉 rg/cg 两行即保持 data.csv 原顺序。
lang: R
