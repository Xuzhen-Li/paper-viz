title: Clustered heatmap
title_zh: 聚类热图
slug: heatmap
category: heatmap
tags:
  - heatmap
  - clustering
  - expression
packages:
  - ggplot2
  - patchwork
data_columns:
  feature: 行名，基因或基因集（字符串）
  sample: 列名（字符串）
  value: 连续表达或得分（数值）
  group: 样本分组，随样本重复（字符串）
when_to_use: 基因对样本的矩阵要同时看模块和组别时用。
customize: plot.R 顶部 view 取 expression、geneset（读 data_geneset.csv）或 module-trait（读 data_module.csv）；show_annotation 打开样本色条；split_columns 在组间留空并只在组内聚类。z 分数在绑图时按行计算。
lang: R
