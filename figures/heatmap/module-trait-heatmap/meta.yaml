customize: 改 `plot.py` 顶部参数块后在本目录运行 `python3 plot.py`；换数据时按列名替换 `data.csv`（`make_data.py` 用固定种子生成模拟数据）。常改项：`cmap`（发散色板）；行列顺序按 `data.csv` 中模块与性状首次出现的顺序。
