title: Mantel test plot
title_zh: Mantel 检验图
slug: mantel-plot
category: microbiome-ecology
tags:
  - mantel
  - environment
  - correlation
packages:
  - ggplot2
  - vegan
data_columns:
  var_a: 环境变量或组学距离名（字符串）
  var_b: 配对的环境变量（字符串）
  r: 环境变量之间的 Pearson 相关；Mantel 行留空（数值）
  p: 相关或 Mantel 的 p 值（数值）
  mantel_r: Mantel r；环境相关行留空（数值）
when_to_use: 同时看环境因子之间的相关，以及它们与组学距离的 Mantel 关系时用。
customize: "Toggle `show_env_heatmap` (default `TRUE`) and `show_links` (default `TRUE`) in `plot.R`, setting `p_cut` (default 0.05) and `link_p_only` (default `TRUE`) to filter lines alongside a hard-coded absolute `mantel_r` threshold of 0.30; provide `var_a`, `var_b`, `r`, `p`, and `mantel_r` columns in `data.csv`."
lang: R
style: house
cells: 2x2
