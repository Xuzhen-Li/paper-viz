title: MA plot
title_zh: MA 图
slug: ma-plot
category: differential-expression
tags:
  - ma-plot
  - differential-expression
  - fold-change
packages:
  - ggplot2
  - ggrepel
data_columns:
  gene: 基因编号（字符串）
  base_mean: 平均表达量（数值，正数）
  log2fc: log2 倍数变化（数值）
  pvalue: 原始 p 值（数值，0 到 1）
when_to_use: 要同时看平均表达和倍数变化、并标出显著基因时用。
customize: lfc_cut 与 p_cut 改显著性阈值；show_labels 与 n_label 控制显著基因标签数量。
lang: R
