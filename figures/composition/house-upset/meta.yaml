data_columns:
  gene: 基因 ID（每行一个元素）
  leaf: 是否属于该集合（0/1，此例为叶片响应）
  root: 是否属于该集合（0/1，根）
  berry_skin: 是否属于该集合（0/1，果皮）
  berry_flesh: 是否属于该集合（0/1，果肉）
  seed: 是否属于该集合（0/1，种子）
when_to_use: 4 个以上集合比较重叠时用（集合多时比韦恩图清楚）；上方柱为互斥交集大小，下方点阵标出交集由哪些集合组成，左侧横柱为各集合大小。只属于一个集合的柱与点用该集合的颜色，多个集合的交集用黑色；数值直接写在柱上，点阵列交替浅灰底，集合名用同色写在点阵旁。
customize: plot.R 顶部 set_cols 把 0/1 列映射为显示名（顺序即行序与配色顺序）；n_show 为显示的交集个数（按大小排序）；band_fill 为交替列底色；dot_size 为点阵点径；widths_mm 为左侧集合柱与集合名的宽度；matrix_share 为点阵与交集柱的高度比。右上角的一句结论由数据算出（最大的多集合交集及其基因数），不写死；左上说明贴在集合柱上方。颜色依次取 pv_palette("house")；文字字号写成印刷 pt（pv_pt2size）。本图 4×2 格（183 × 89 mm），多面板（patchwork）字号保持 7/8 pt，不自动 +2 pt。
