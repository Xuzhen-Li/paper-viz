# Simulated data. References are links only (URL + figure number); no text or images copied.
title: Scatter with group fits (house style)
title_zh: 分组散点与回归（house 风格）
slug: house-scatter
category: correlation
tags:
  - scatter
  - regression
  - direct-labels
  - house-style
packages:
  - ggplot2
  - ggrepel
data_columns:
  group: 分组（字符串，3 组）
  name: 样品名（字符串，用于点标签）
  berry_weight_g: 浆果重（g，正数，x 轴取对数）
  anthocyanin_mg_g: 花青素含量（mg/g FW）
when_to_use: 两个连续变量、分几组看关系时用；每组一条拟合线，R² 与 P 写在图内，组名和重点样品直接标在点旁，不用图例。
customize: plot.R 顶部 label_names 选要标名的点（≤30 个）；group_order 定组序与配色；point_size 调点径（2.2–2.6）。颜色取 pv_palette("house")；文字字号写成印刷 pt（pv_pt2size），单栏单面板由 pv_save_house() 自动 +2 pt。
lang: R
style: house
