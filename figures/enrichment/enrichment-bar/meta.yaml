customize: "Edit `horizontal` (default `TRUE`), `facet_ontology` (default `TRUE`), and `bar_stat` (default \"nlp\") in `plot.R` to control layout and axis statistics; supply `term`, `ontology`, `fold`, `p`, and `count` columns in `data.csv`."
