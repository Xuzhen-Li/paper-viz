customize: "Toggle `size_maps_count` (default `TRUE`), `colour_maps_p` (default `TRUE`), and `facet_by_ontology` (default `TRUE`) in `plot.R` to configure point mapping; provide `term`, `ontology`, `ratio`, `count`, and `p` columns in `data.csv`."
