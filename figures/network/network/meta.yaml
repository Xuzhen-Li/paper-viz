when_to_use: 看特征之间的相关边、边权和社区结构时用。
customize: "在 `plot.R` 调整 `weight_min` 过滤边，控制 `show_labels`（默认 `FALSE`）显隐节点名，设定 `colour_by` 着色方式；在 `data.csv` 填 `from`、`to`、`weight`，在 `data_nodes.csv` 填 `node`。"
