<text x="3.000" y="7.000" font-size="2.4694" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">Example: BFS, b = 2</text>
<text x="3.000" y="10.400" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">each level: keep the 2 highest v,</text>
