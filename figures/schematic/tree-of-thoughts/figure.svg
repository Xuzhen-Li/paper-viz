<g id="procedure">
<rect x="117.000" y="3.000" width="63.000" height="83.000" rx="1.800" fill="#F7F7F7" stroke="#BFBFBF" stroke-width="0.1764"/>
<text x="119.000" y="6.600" font-size="2.6458" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">Search over thoughts</text>
<rect x="121.000" y="11.000" width="55.000" height="22.000" rx="1.200" fill="#E0EBF4" stroke="#1F72AE" stroke-width="0.2822"/>
<text x="124.000" y="16.200" font-size="2.4694" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">1  Generate</text>
<text x="124.000" y="20.551" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">the LLM proposes k candidate</text>
<text x="124.000" y="23.349" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">thoughts (next steps) from</text>
<text x="124.000" y="26.146" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">each state</text>
<rect x="121.000" y="36.000" width="55.000" height="22.000" rx="1.200" fill="#FEEDDE" stroke="#F77E12" stroke-width="0.2822"/>
<text x="124.000" y="41.200" font-size="2.4694" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">2  Evaluate</text>
<text x="124.000" y="45.551" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">the LLM scores each state</text>
<text x="124.000" y="48.349" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">(value, v) or votes among</text>
<text x="124.000" y="51.146" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">candidates</text>
<rect x="121.000" y="61.000" width="55.000" height="22.000" rx="1.200" fill="#E8E7F0" stroke="#595594" stroke-width="0.2822"/>
<text x="124.000" y="66.200" font-size="2.4694" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">3  Search</text>
<text x="124.000" y="70.551" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">breadth-first: keep the best</text>
<text x="124.000" y="73.349" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">b states per level; depth-first:</text>
<text x="124.000" y="76.146" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">backtrack from dead ends</text>
</g>
