<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="89.000mm" viewBox="0 0 183.000 89.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>literature-agent-tools</title>
<desc>Tool-using literature agent: an LLM agent answers a research question by repeatedly choosing one of four tools (search papers, gather evidence, follow citations, write answer) and returns an answer with citations. Tool names are generic. Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
<rect id="background" x="0" y="0" width="183.000" height="89.000" fill="#FFFFFF"/>
<g id="agent">
<rect x="2.000" y="3.000" width="50.000" height="83.000" rx="1.800" fill="#F7F7F7" stroke="#BFBFBF" stroke-width="0.1764"/>
<text x="4.000" y="6.600" font-size="2.6458" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">Agent</text>
<rect x="5.000" y="10.000" width="44.000" height="18.000" rx="1.200" fill="#EDEDED" stroke="#595959" stroke-width="0.2822"/>
<rect x="25.290" y="13.512" width="3.420" height="4.500" rx="0.400" fill="#FFFFFF" stroke="#434343" stroke-width="0.2822"/>
<polyline points="25.974,14.772 28.026,14.772" fill="none" stroke="#434343" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="25.974,15.672 28.026,15.672" fill="none" stroke="#434343" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="25.974,16.572 28.026,16.572" fill="none" stroke="#434343" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<text x="27.000" y="21.190" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Question</text>
<text x="27.000" y="24.488" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">a research question in plain text</text>
<rect x="5.000" y="34.000" width="44.000" height="28.000" rx="1.200" fill="#E8E7F0" stroke="#595594" stroke-width="0.2822"/>
<polyline points="25.880,39.465 25.880,44.465" fill="none" stroke="#43406F" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="24.500,40.845 29.500,40.845" fill="none" stroke="#43406F" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="27.000,39.465 27.000,44.465" fill="none" stroke="#43406F" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="24.500,41.965 29.500,41.965" fill="none" stroke="#43406F" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="28.120,39.465 28.120,44.465" fill="none" stroke="#43406F" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="24.500,43.085 29.500,43.085" fill="none" stroke="#43406F" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<rect x="25.000" y="39.965" width="4.000" height="4.000" rx="0.500" fill="#FFFFFF" stroke="#43406F" stroke-width="0.2822"/>
<rect x="26.120" y="41.085" width="1.760" height="1.760" rx="0.200" fill="#43406F" stroke="none" stroke-width="0.2822"/>
<text x="27.000" y="47.643" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">LLM agent</text>
<text x="27.000" y="50.940" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">looks at the current state and</text>
<text x="27.000" y="53.738" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">calls one tool per step;</text>
<text x="27.000" y="56.535" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">repeats until it can answer</text>
<rect x="5.000" y="68.000" width="44.000" height="15.000" rx="1.200" fill="#FFFFFF" stroke="#595959" stroke-width="0.2822" stroke-dasharray="1.200 0.900"/>
<text x="27.000" y="74.690" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Shared state</text>
<text x="27.000" y="78.088" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">papers, evidence notes, draft</text>
<polyline points="27.000,28.000 27.000,32.937" fill="none" stroke="#595959" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="27.000,34.000 26.368,32.482 27.000,32.862 27.632,32.482" fill="#595959"/>
<polyline points="27.000,62.000 27.000,68.000" fill="none" stroke="#595959" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="1.200 0.900"/>
</g>
<g id="tools">
<rect x="56.000" y="3.000" width="94.000" height="83.000" rx="1.800" fill="#F7F7F7" stroke="#BFBFBF" stroke-width="0.1764"/>
<text x="58.000" y="6.600" font-size="2.6458" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">Tools (one call per step)</text>
<rect x="64.000" y="10.000" width="82.000" height="16.000" rx="1.200" fill="#E0EBF4" stroke="#1F72AE" stroke-width="0.2822"/>
<ellipse cx="70.450" cy="17.450" rx="1.650" ry="1.650" fill="#FFFFFF" stroke="#175682" stroke-width="0.2822"/>
<polyline points="71.605,18.605 73.200,20.200" fill="none" stroke="#175682" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<text x="78.000" y="15.841" font-size="2.4694" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">1  Search papers</text>
<text x="78.000" y="19.139" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">run keyword queries; fetch, parse and</text>
<text x="78.000" y="21.937" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">split new papers into text chunks</text>
<rect x="64.000" y="29.000" width="82.000" height="16.000" rx="1.200" fill="#E9F4FC" stroke="#62B4E7" stroke-width="0.2822"/>
<rect x="68.910" y="34.250" width="4.180" height="5.500" rx="0.400" fill="#FFFFFF" stroke="#4A87AD" stroke-width="0.2822"/>
<polyline points="69.746,35.790 72.254,35.790" fill="none" stroke="#4A87AD" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="69.746,36.890 72.254,36.890" fill="none" stroke="#4A87AD" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="69.746,37.990 72.254,37.990" fill="none" stroke="#4A87AD" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<text x="78.000" y="34.841" font-size="2.4694" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">2  Gather evidence</text>
<text x="78.000" y="38.139" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">rank chunks for the question; the LLM</text>
<text x="78.000" y="40.937" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">scores and summarises the best ones</text>
<rect x="64.000" y="48.000" width="82.000" height="16.000" rx="1.200" fill="#FEEDDE" stroke="#F77E12" stroke-width="0.2822"/>
<rect x="68.000" y="53.540" width="2.520" height="3.720" rx="0.300" fill="#FFFFFF" stroke="#B95E0E" stroke-width="0.2822"/>
<rect x="71.480" y="54.860" width="2.520" height="3.720" rx="0.300" fill="#FFFFFF" stroke="#B95E0E" stroke-width="0.2822"/>
<polyline points="70.520,55.700 71.480,55.700" fill="none" stroke="#B95E0E" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<text x="78.000" y="53.841" font-size="2.4694" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">3  Follow citations</text>
<text x="78.000" y="57.139" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">add papers that cite, or are cited by,</text>
<text x="78.000" y="59.937" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">papers that gave evidence</text>
<rect x="64.000" y="67.000" width="82.000" height="16.000" rx="1.200" fill="#DEF1EC" stroke="#119B76" stroke-width="0.2822"/>
<polyline points="69.075,75.000 70.450,76.650 73.200,73.075" fill="none" stroke="#0D7458" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<text x="78.000" y="72.841" font-size="2.4694" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">4  Write answer</text>
<text x="78.000" y="76.139" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">draft an answer from the evidence</text>
<text x="78.000" y="78.937" font-size="2.2931" fill="#1A1A1A" text-anchor="start" xml:space="preserve">with a citation for each claim</text>
<polyline points="52.000,48.000 59.000,48.000" fill="none" stroke="#43406F" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="59.000,18.000 59.000,75.000" fill="none" stroke="#43406F" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="49.000,48.000 52.000,48.000" fill="none" stroke="#43406F" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="59.000,18.000 62.699,18.000" fill="none" stroke="#43406F" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="64.000,18.000 62.141,18.775 62.606,18.000 62.141,17.225" fill="#43406F"/>
<polyline points="59.000,37.000 62.699,37.000" fill="none" stroke="#43406F" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="64.000,37.000 62.141,37.775 62.606,37.000 62.141,36.225" fill="#43406F"/>
<polyline points="59.000,56.000 62.699,56.000" fill="none" stroke="#43406F" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="64.000,56.000 62.141,56.775 62.606,56.000 62.141,55.225" fill="#43406F"/>
<polyline points="59.000,75.000 62.699,75.000" fill="none" stroke="#43406F" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="64.000,75.000 62.141,75.775 62.606,75.000 62.141,74.225" fill="#43406F"/>
</g>
<g id="output">
<rect x="153.000" y="3.000" width="28.000" height="83.000" rx="1.800" fill="#F7F7F7" stroke="#BFBFBF" stroke-width="0.1764"/>
<text x="155.000" y="6.600" font-size="2.6458" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">Output</text>
<rect x="156.000" y="10.000" width="22.000" height="50.000" rx="1.200" fill="#FFFFFF" stroke="#595959" stroke-width="0.2822" stroke-dasharray="1.200 0.900"/>
<text x="167.000" y="27.196" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Loop</text>
<text x="167.000" y="30.594" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">if evidence is</text>
<text x="167.000" y="33.391" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">thin, search or</text>
<text x="167.000" y="36.189" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">gather again;</text>
<text x="167.000" y="38.987" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">if still thin,</text>
<text x="167.000" y="41.784" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">reply that it</text>
<text x="167.000" y="44.582" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">cannot answer</text>
<rect x="156.000" y="66.000" width="22.000" height="18.000" rx="1.200" fill="#DEF1EC" stroke="#119B76" stroke-width="0.2822"/>
<polyline points="165.425,71.762 166.550,73.112 168.800,70.187" fill="none" stroke="#0D7458" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<text x="167.000" y="77.190" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Answer</text>
<text x="167.000" y="80.488" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">with sources</text>
<polyline points="146.000,75.000 154.699,75.000" fill="none" stroke="#0D7458" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="156.000,75.000 154.141,75.775 154.606,75.000 154.141,74.225" fill="#0D7458"/>
</g>
</svg>
