<text x="28.500" y="50.524" font-size="2.1167" fill="#595959" text-anchor="middle" xml:space="preserve">any mix of backends, e.g. an LLM</text>
<text x="28.500" y="53.106" font-size="2.1167" fill="#595959" text-anchor="middle" xml:space="preserve">that writes code + a tool that runs it</text>
