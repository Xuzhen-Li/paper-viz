<text x="11.500" y="42.762" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">LLM</text>
<rect x="20.500" y="33.000" width="16.000" height="13.000" rx="1.200" fill="#FEEDDE" stroke="#F77E12" stroke-width="0.2822"/>
<polyline points="27.708,36.558 26.700,38.238 27.708,39.918" fill="none" stroke="#B95E0E" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
