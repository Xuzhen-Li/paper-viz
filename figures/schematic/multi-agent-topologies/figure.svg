<svg xmlns="http://www.w3.org/2000/svg" width="181.000mm" height="89.000mm" viewBox="0 0 181.000 89.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>multi-agent-topologies</title>
<desc>Conversable agents (each replies using an LLM, tools/code, a human, or a mix) and three conversation topologies built from them: a two-agent chat, a group chat run by a manager that picks the next speaker, and a hierarchical chat with nested sub-chats. Generic role names. Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
<rect id="background" x="0" y="0" width="181.000" height="89.000" fill="#FFFFFF"/>
<g id="conversable-agent">
<rect x="1.000" y="1.500" width="55.000" height="86.000" rx="1.800" fill="#F7F7F7" stroke="#BFBFBF" stroke-width="0.1764"/>
<text x="3.000" y="5.100" font-size="2.6458" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">Conversable agent</text>
<rect x="9.000" y="9.000" width="39.000" height="14.000" rx="1.200" fill="#E0EBF4" stroke="#1F72AE" stroke-width="0.2822"/>
