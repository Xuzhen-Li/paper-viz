<text x="28.500" y="17.139" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">sends, receives and replies</text>
<text x="28.500" y="19.721" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">to messages</text>
