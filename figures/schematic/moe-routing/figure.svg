<svg xmlns="http://www.w3.org/2000/svg" width="89.000mm" height="66.000mm" viewBox="0 0 89.000 66.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>moe-routing</title>
<desc>Schematic: token routed to the top-2 of 4 experts in a sparse MoE layer. Layout type only; numbers illustrative.</desc>
<rect x="0" y="0" width="89.000" height="66.000" fill="#ffffff"/>
