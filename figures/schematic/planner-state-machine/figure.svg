<svg xmlns="http://www.w3.org/2000/svg" width="181.000mm" height="89.000mm" viewBox="0 0 181.000 89.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>planner-state-machine</title>
<desc>An LLM planner splits a user request into an ordered task list; each task runs as a chain of states, and each state is one interaction round: the state gives instructions and asks for the inputs it needs, the user (or an LLM agent acting for the user) replies, and the state returns output and feedback, calling tools if needed, before moving to the next state. A human user supervises the whole process and can correct any state or take over. Generic labels only, no real targets. Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
