<text x="25.400" y="54.662" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">task-specific prompts</text>
<text x="25.500" y="77.724" font-size="2.1167" fill="#595959" text-anchor="middle" xml:space="preserve">any agent that maps the</text>
