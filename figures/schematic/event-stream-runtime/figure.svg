<text x="5.400" y="39.862" font-size="2.1167" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">Coding agent</text>
<text x="25.400" y="39.862" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">code + shell</text>
<rect x="4.000" y="43.400" width="43.000" height="6.200" rx="0.800" fill="#E0EBF4" stroke="#1F72AE" stroke-width="0.2822"/>
