<text x="25.500" y="24.521" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">returns the next action</text>
<text x="4.000" y="33.600" font-size="2.1167" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">Agent hub (interchangeable)</text>
