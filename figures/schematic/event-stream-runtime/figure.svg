<svg xmlns="http://www.w3.org/2000/svg" width="181.000mm" height="89.000mm" viewBox="0 0 181.000 89.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>event-stream-runtime</title>
<desc>An agent platform in three parts: an agent abstraction (any agent maps the event history to the next action), an ordered event stream of messages, actions and observations, and a sandboxed runtime that executes actions (shell, Python kernel, browser) and returns observations. Generic example events. Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
