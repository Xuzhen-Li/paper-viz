<rect x="24.690" y="12.969" width="1.619" height="1.619" rx="0.200" fill="#175682" stroke="none" stroke-width="0.2822"/>
<text x="25.500" y="18.857" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Agent</text>
