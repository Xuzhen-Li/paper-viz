<text x="17.000" y="41.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">tasks, tools,</text>
<text x="17.000" y="43.848" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">data used</text>
