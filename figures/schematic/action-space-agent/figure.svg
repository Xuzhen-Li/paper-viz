<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="60.000mm" viewBox="0 0 183.000 60.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>action-space-agent</title>
<desc>Schematic: agent whose action space is mined from the literature, then plan-code-execute. Layout type only; labels generic.</desc>
<rect x="0" y="0" width="183.000" height="60.000" fill="#ffffff"/>
