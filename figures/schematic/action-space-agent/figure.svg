<text x="164.000" y="37.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">runs code</text>
<rect x="117.000" y="30.000" width="28.000" height="11.098" rx="1.20" fill="#F6DEDE" stroke="#CC312C" stroke-width="0.2822"/>
