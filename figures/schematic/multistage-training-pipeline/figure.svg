<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="58.000mm" viewBox="0 0 183.000 58.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>multistage-training-pipeline</title>
<desc>Schematic: multi-stage training of a reasoning language model (SFT and RL alternating). Layout type only; labels generic.</desc>
<rect x="0" y="0" width="183.000" height="58.000" fill="#ffffff"/>
<g id="zone-main">
<rect x="1.000" y="1.000" width="181.000" height="37.000" rx="1.60" fill="#f2f4f7" stroke="#c9ced6" stroke-width="0.1764"/>
<text x="91.500" y="4.600" font-size="2.6811" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Main pipeline: four training stages</text>
</g>
<g id="stages">
<rect x="4.000" y="13.000" width="22.000" height="8.298" rx="1.20" fill="#ffffff" stroke="#5b6878" stroke-width="0.2822"/>
<text x="15.000" y="16.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Base model</text>
<text x="15.000" y="20.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">pretrained LM</text>
<rect x="31.000" y="11.000" width="28.000" height="11.098" rx="1.20" fill="#DEE4F0" stroke="#1F72AE" stroke-width="0.2822"/>
<text x="45.000" y="14.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Stage 1</text>
<text x="45.000" y="18.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">cold-start SFT</text>
<text x="45.000" y="20.848" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">few long CoT examples</text>
<rect x="63.000" y="11.000" width="28.000" height="11.098" rx="1.20" fill="#fde8d4" stroke="#e08a3a" stroke-width="0.2822"/>
<text x="77.000" y="14.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Stage 2</text>
<text x="77.000" y="18.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">reasoning RL</text>
<text x="77.000" y="20.848" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">rule-based rewards</text>
<rect x="95.000" y="11.000" width="28.000" height="11.098" rx="1.20" fill="#DEE4F0" stroke="#1F72AE" stroke-width="0.2822"/>
<text x="109.000" y="14.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Stage 3</text>
<text x="109.000" y="18.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">rejection sampling</text>
<text x="109.000" y="20.848" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">+ SFT on mixed data</text>
<rect x="127.000" y="11.000" width="28.000" height="11.098" rx="1.20" fill="#fde8d4" stroke="#e08a3a" stroke-width="0.2822"/>
<text x="141.000" y="14.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Stage 4</text>
<text x="141.000" y="18.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">RL on all prompts</text>
<text x="141.000" y="20.848" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">rule + preference rewards</text>
<rect x="160.000" y="13.000" width="19.000" height="8.298" rx="1.20" fill="#e8f3ea" stroke="#2e7d32" stroke-width="0.2822"/>
<text x="169.500" y="16.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Final</text>
<text x="169.500" y="20.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">reasoning model</text>
<polyline points="26.000,17.149 29.500,17.149" fill="none" stroke="#1c2430" stroke-width="0.4233" stroke-linejoin="round"/>
<polygon points="30.700,17.149 29.200,17.769 29.200,16.529" fill="#1c2430"/>
<polyline points="59.000,16.549 61.500,16.549" fill="none" stroke="#1c2430" stroke-width="0.4233" stroke-linejoin="round"/>
<polygon points="62.700,16.549 61.200,17.169 61.200,15.929" fill="#1c2430"/>
<polyline points="91.000,16.549 93.500,16.549" fill="none" stroke="#1c2430" stroke-width="0.4233" stroke-linejoin="round"/>
<polygon points="94.700,16.549 93.200,17.169 93.200,15.929" fill="#1c2430"/>
<polyline points="123.000,16.549 125.500,16.549" fill="none" stroke="#1c2430" stroke-width="0.4233" stroke-linejoin="round"/>
<polygon points="126.700,16.549 125.200,17.169 125.200,15.929" fill="#1c2430"/>
<polyline points="155.000,16.549 158.500,16.549" fill="none" stroke="#1c2430" stroke-width="0.4233" stroke-linejoin="round"/>
<polygon points="159.700,16.549 158.200,17.169 158.200,15.929" fill="#1c2430"/>
<text x="77.000" y="30.600" font-size="2.1167" fill="#5b6878" text-anchor="middle" xml:space="preserve">checkpoint samples</text>
<polyline points="77.000,22.098 77.000,33.000 109.000,33.000 109.000,23.598" fill="none" stroke="#5b6878" stroke-width="0.2822" stroke-linejoin="round"/>
<polygon points="109.000,22.398 109.620,23.898 108.380,23.898" fill="#5b6878"/>
<text x="45.000" y="8.000" font-size="2.1167" fill="#1F72AE" text-anchor="middle" xml:space="preserve">SFT</text>
<text x="77.000" y="8.000" font-size="2.1167" fill="#e08a3a" text-anchor="middle" xml:space="preserve">RL</text>
<text x="109.000" y="8.000" font-size="2.1167" fill="#1F72AE" text-anchor="middle" xml:space="preserve">SFT</text>
<text x="141.000" y="8.000" font-size="2.1167" fill="#e08a3a" text-anchor="middle" xml:space="preserve">RL</text>
</g>
<g id="zone-side">
<rect x="1.000" y="40.000" width="181.000" height="17.000" rx="1.60" fill="#f2f4f7" stroke="#c9ced6" stroke-width="0.1764"/>
<text x="91.500" y="43.600" font-size="2.6811" fill="#5b6878" text-anchor="middle" font-weight="bold" xml:space="preserve">Side branches</text>
<rect x="31.000" y="45.000" width="60.000" height="8.298" rx="1.20" fill="#fde8d4" stroke="#e08a3a" stroke-width="0.2822" stroke-dasharray="0.9 0.6"/>
<text x="61.000" y="48.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Pure-RL variant</text>
<text x="61.000" y="52.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">RL straight from the base model, no SFT</text>
<rect x="108.000" y="45.000" width="60.000" height="8.298" rx="1.20" fill="#e3f4f1" stroke="#2aa198" stroke-width="0.2822" stroke-dasharray="0.9 0.6"/>
<text x="138.000" y="48.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Distillation</text>
<text x="138.000" y="52.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">SFT small models on stage-3 data</text>
<polyline points="15.000,21.298 15.000,49.149 29.500,49.149" fill="none" stroke="#e08a3a" stroke-width="0.2822" stroke-linejoin="round" stroke-dasharray="0.9 0.6"/>
<polygon points="30.700,49.149 29.200,49.769 29.200,48.529" fill="#e08a3a"/>
<polyline points="119.000,22.098 119.000,36.000 115.000,36.000 115.000,43.500" fill="none" stroke="#2aa198" stroke-width="0.2822" stroke-linejoin="round" stroke-dasharray="0.9 0.6"/>
<polygon points="115.000,44.700 114.380,43.200 115.620,43.200" fill="#2aa198"/>
</g>
</svg>
