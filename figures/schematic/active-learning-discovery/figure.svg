<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="89.000mm" viewBox="0 0 183.000 89.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>active-learning-discovery</title>
<desc>Active-learning discovery loop with two routes: partial substitutions in known structures are filtered by a structure graph network and sent to DFT; new compositions are filtered by a composition graph network on reduced formulas (no structure), then AIRSS initialises 100 random structures per kept composition before DFT. Verified stable candidates are kept, all new DFT labels retrain the filters and stable results seed new substitutions in the next round. Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
