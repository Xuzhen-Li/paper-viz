<text x="19.000" y="39.848" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">chat at any time</text>
<rect x="4.000" y="48.000" width="30.000" height="11.098" rx="1.20" fill="#e8f3ea" stroke="#2e7d32" stroke-width="0.2822"/>
