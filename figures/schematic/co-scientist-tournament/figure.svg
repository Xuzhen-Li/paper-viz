<text x="100.500" y="32.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Meta-review</text>
<text x="100.500" y="36.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">summarise critiques</text>
