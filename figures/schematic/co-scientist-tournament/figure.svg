<text x="132.500" y="36.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">cluster, dedupe</text>
<rect x="150.000" y="29.000" width="29.000" height="8.298" rx="1.20" fill="#fde8d4" stroke="#e08a3a" stroke-width="0.2822"/>
<text x="164.500" y="32.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Evolution</text>
<text x="164.500" y="36.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">combine, simplify</text>
</g>
