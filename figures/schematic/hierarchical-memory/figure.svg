<ellipse cx="151.500" cy="14.198" rx="1.890" ry="0.585" fill="#FFFFFF" stroke="#B95E0E" stroke-width="0.2822"/>
<text x="151.500" y="21.291" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Archival storage</text>
<text x="151.500" y="24.589" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">any text; read and written</text>
<text x="151.500" y="27.387" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">only through function calls</text>
<rect x="125.000" y="34.000" width="53.000" height="21.000" rx="1.200" fill="#FEEDDE" stroke="#F77E12" stroke-width="0.2822"/>
<rect x="149.610" y="38.198" width="3.780" height="3.330" rx="0.000" fill="#FFFFFF" stroke="none" stroke-width="0.2822"/>
<polyline points="149.610,38.198 149.610,41.528" fill="none" stroke="#B95E0E" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="153.390,38.198 153.390,41.528" fill="none" stroke="#B95E0E" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="153.390,41.528 153.354,41.643 153.246,41.752 153.071,41.853 152.836,41.942 152.550,42.015 152.223,42.069 151.869,42.102 151.500,42.113 151.131,42.102 150.777,42.069 150.450,42.015 150.164,41.942 149.929,41.853 149.754,41.752 149.646,41.643 149.610,41.528" fill="none" stroke="#B95E0E" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="153.390,39.863 153.354,39.978 153.246,40.087 153.071,40.188 152.836,40.277 152.550,40.350 152.223,40.404 151.869,40.437 151.500,40.448 151.131,40.437 150.777,40.404 150.450,40.350 150.164,40.277 149.929,40.188 149.754,40.087 149.646,39.978 149.610,39.863" fill="none" stroke="#B95E0E" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<ellipse cx="151.500" cy="38.198" rx="1.890" ry="0.585" fill="#FFFFFF" stroke="#B95E0E" stroke-width="0.2822"/>
<text x="151.500" y="45.291" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Recall storage</text>
<text x="151.500" y="48.589" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">full message history;</text>
<text x="151.500" y="51.387" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">searched through function calls</text>
</g>
<g id="processor">
