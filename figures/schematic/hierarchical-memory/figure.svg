<text x="76.500" y="75.791" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">LLM processor (fixed context window)</text>
<text x="76.500" y="79.089" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">reads the whole main context as its prompt;</text>
<text x="76.500" y="81.887" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">outputs text or one function call</text>
<rect x="122.000" y="64.000" width="59.000" height="22.000" rx="1.200" fill="#DEF1EC" stroke="#119B76" stroke-width="0.2822"/>
<polyline points="152.850,70.363 153.570,70.363" fill="none" stroke="#0D7458" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="152.455,71.318 152.964,71.827" fill="none" stroke="#0D7458" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="151.500,71.713 151.500,72.433" fill="none" stroke="#0D7458" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="150.545,71.318 150.036,71.827" fill="none" stroke="#0D7458" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
