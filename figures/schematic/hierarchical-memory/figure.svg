<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="89.000mm" viewBox="0 0 183.000 89.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>hierarchical-memory</title>
<desc>Hierarchical memory for an LLM agent: a fixed-context LLM processor reads a main context (system instructions, working context, FIFO message queue) and manages archival and recall storage outside the prompt through function calls. Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
<rect id="background" x="0" y="0" width="183.000" height="89.000" fill="#FFFFFF"/>
<g id="inputs">
<rect x="2.000" y="3.000" width="35.000" height="55.000" rx="1.800" fill="#F7F7F7" stroke="#BFBFBF" stroke-width="0.1764"/>
<text x="4.000" y="6.600" font-size="2.6458" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">Inputs</text>
<rect x="5.000" y="10.000" width="29.000" height="22.000" rx="1.200" fill="#EDEDED" stroke="#595959" stroke-width="0.2822"/>
<ellipse cx="19.500" cy="15.283" rx="0.900" ry="0.900" fill="#FFFFFF" stroke="#434343" stroke-width="0.2822"/>
<polyline points="17.970,18.613 17.999,18.315 18.086,18.028 18.228,17.763 18.418,17.532 18.650,17.341 18.914,17.200 19.202,17.113 19.500,17.083 19.798,17.113 20.086,17.200 20.350,17.341 20.582,17.532 20.772,17.763 20.914,18.028 21.001,18.315 21.030,18.613" fill="none" stroke="#434343" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="round"/>
<text x="19.500" y="21.791" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Events</text>
<text x="19.500" y="25.089" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">user messages,</text>
<text x="19.500" y="27.887" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">system alerts</text>
<rect x="5.000" y="38.000" width="29.000" height="17.000" rx="1.200" fill="#EDEDED" stroke="#595959" stroke-width="0.2822"/>
<text x="19.500" y="44.291" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Queue manager</text>
<text x="19.500" y="47.689" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">appends events; logs</text>
<text x="19.500" y="50.487" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">all to recall storage</text>
<polyline points="19.500,32.000 19.500,36.937" fill="none" stroke="#595959" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="19.500,38.000 18.868,36.482 19.500,36.862 20.132,36.482" fill="#595959"/>
</g>
<g id="main-context">
<rect x="40.000" y="3.000" width="73.000" height="55.000" rx="1.800" fill="#F7F7F7" stroke="#9AC0DB" stroke-width="0.1764"/>
<text x="42.000" y="6.600" font-size="2.6458" fill="#175682" text-anchor="start" font-weight="bold" xml:space="preserve">Main context (inside the prompt)</text>
<rect x="43.000" y="10.000" width="67.000" height="12.000" rx="1.200" fill="#E0EBF4" stroke="#1F72AE" stroke-width="0.2822"/>
<text x="76.500" y="15.190" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">System instructions</text>
<text x="76.500" y="18.588" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">read-only; describes the memory functions</text>
<rect x="43.000" y="24.000" width="67.000" height="12.000" rx="1.200" fill="#E0EBF4" stroke="#1F72AE" stroke-width="0.2822"/>
<text x="76.500" y="29.190" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Working context</text>
<text x="76.500" y="32.588" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">key facts; changed only through function calls</text>
<rect x="43.000" y="38.000" width="67.000" height="17.000" rx="1.200" fill="#E0EBF4" stroke="#1F72AE" stroke-width="0.2822"/>
<text x="76.500" y="44.291" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">FIFO queue</text>
<text x="76.500" y="47.689" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">recent messages and function results; when</text>
<text x="76.500" y="50.487" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">full, oldest are evicted and summarised</text>
<polyline points="34.000,46.500 41.937,46.500" fill="none" stroke="#595959" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="43.000,46.500 41.482,47.132 41.862,46.500 41.482,45.868" fill="#595959"/>
</g>
<g id="external-context">
<rect x="122.000" y="3.000" width="59.000" height="55.000" rx="1.800" fill="#F7F7F7" stroke="#CAAEA5" stroke-width="0.1764"/>
<text x="124.000" y="6.600" font-size="2.6458" fill="#68392A" text-anchor="start" font-weight="bold" xml:space="preserve">External context (outside the prompt)</text>
<rect x="125.000" y="10.000" width="53.000" height="21.000" rx="1.200" fill="#FEEDDE" stroke="#F77E12" stroke-width="0.2822"/>
<rect x="149.610" y="14.198" width="3.780" height="3.330" rx="0.000" fill="#FFFFFF" stroke="none" stroke-width="0.2822"/>
<polyline points="149.610,14.198 149.610,17.528" fill="none" stroke="#B95E0E" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="153.390,14.198 153.390,17.528" fill="none" stroke="#B95E0E" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="153.390,17.528 153.354,17.643 153.246,17.752 153.071,17.853 152.836,17.942 152.550,18.015 152.223,18.069 151.869,18.102 151.500,18.113 151.131,18.102 150.777,18.069 150.450,18.015 150.164,17.942 149.929,17.853 149.754,17.752 149.646,17.643 149.610,17.528" fill="none" stroke="#B95E0E" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
