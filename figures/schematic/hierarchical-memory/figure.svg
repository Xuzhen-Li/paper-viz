</g>
<g id="note">
<text x="3.000" y="66.000" font-size="2.1167" fill="#595959" text-anchor="start" xml:space="preserve">The LLM sees only the</text>
<text x="3.000" y="68.600" font-size="2.1167" fill="#595959" text-anchor="start" xml:space="preserve">main context; outside</text>
<text x="3.000" y="71.200" font-size="2.1167" fill="#595959" text-anchor="start" xml:space="preserve">memory comes in only</text>
<text x="3.000" y="73.800" font-size="2.1167" fill="#595959" text-anchor="start" xml:space="preserve">through function calls.</text>
</g>
