<polyline points="89.000,14.104 141.000,14.104 141.000,15.549 141.500,15.549" fill="none" stroke="#1c2430" stroke-width="0.2822" stroke-linejoin="round"/>
<polygon points="142.700,15.549 141.200,16.169 141.200,14.929" fill="#1c2430"/>
<text x="115.000" y="12.904" font-size="2.1167" fill="#1c2430" text-anchor="middle" xml:space="preserve">command</text>
<polyline points="143.000,20.549 137.500,20.549 137.500,36.949 132.500,36.949" fill="none" stroke="#CC312C" stroke-width="0.2822" stroke-linejoin="round"/>
<polygon points="131.300,36.949 132.800,36.329 132.800,37.569" fill="#CC312C"/>
<polyline points="112.500,43.898 112.500,51.500 21.000,51.500 21.000,46.598" fill="none" stroke="#CC312C" stroke-width="0.2822" stroke-linejoin="round"/>
<polygon points="21.000,45.398 21.620,46.898 20.380,46.898" fill="#CC312C"/>
<polyline points="21.000,34.000 21.000,24.598" fill="none" stroke="#1c2430" stroke-width="0.2822" stroke-linejoin="round"/>
<polygon points="21.000,23.398 21.620,24.898 20.380,24.898" fill="#1c2430"/>
<polyline points="160.500,45.098 160.500,54.500 42.500,54.500 42.500,20.049 39.500,20.049" fill="none" stroke="#1F72AE" stroke-width="0.1764" stroke-linejoin="round" stroke-dasharray="0.9 0.6"/>
<polygon points="38.300,20.049 39.800,19.429 39.800,20.669" fill="#1F72AE"/>
<text x="162.000" y="49.400" font-size="2.1167" fill="#1F72AE" text-anchor="start" xml:space="preserve">given once</text>
<text x="162.000" y="52.000" font-size="2.1167" fill="#1F72AE" text-anchor="start" xml:space="preserve">at the start</text>
<text x="70.000" y="50.400" font-size="2.1167" fill="#CC312C" text-anchor="middle" xml:space="preserve">observation</text>
