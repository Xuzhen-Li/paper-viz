<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="89.000mm" viewBox="0 0 183.000 89.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>genomic-language-model</title>
<desc>DNA language model task distribution: a model pretrained by next-token prediction on single-nucleotide tokens from a genome collection is used for zero-shot prediction (mutation effects at molecular scale; gene essentiality at genome scale; no systems-scale prediction task claimed in the source text used here) and for sequence design (single molecules, multi-part protein-RNA or protein-DNA systems, genome-length sequences). Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
