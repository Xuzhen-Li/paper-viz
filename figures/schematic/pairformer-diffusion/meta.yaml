customize: "改 `build.py` 底部 figure 段：`inputs` 列表改输入卡片，`blocks` 改 Pairformer 内部块，扩散模块示意的点位在 `g_dots`/`g_chain` 调用里；运行 `python3 build.py <新的空目录>` 生成 figure.svg、template.drawio、preview.png（只写新文件，目标目录已有同名文件时拒绝运行）。也可直接在 draw.io 打开 `template.drawio`。脚本在文字出框、重叠、小于 6 pt、线宽超出 0.5-1.6 pt 或对比度低于 4.5:1 时报错退出。"
