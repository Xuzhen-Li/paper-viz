<title>pairformer-diffusion</title>
<desc>Structure-prediction architecture: inputs are embedded as tokens, a Pairformer trunk updates single and pair representations (with recycling), and a diffusion module denoises atom coordinates conditioned on the trunk, giving a structure and confidence estimates. Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
