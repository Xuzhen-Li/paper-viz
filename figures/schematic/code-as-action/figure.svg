<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="62.000mm" viewBox="0 0 183.000 62.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>code-as-action</title>
<desc>Schematic: JSON tool calls versus executable code actions for an LLM agent. Layout type only; code invented.</desc>
<rect x="0" y="0" width="183.000" height="62.000" fill="#ffffff"/>
<g id="zone-json">
<rect x="1.000" y="1.000" width="89.000" height="60.000" rx="1.60" fill="#f2f4f7" stroke="#c9ced6" stroke-width="0.1764"/>
<text x="45.500" y="4.600" font-size="2.6811" fill="#5b6878" text-anchor="middle" font-weight="bold" xml:space="preserve">Text or JSON actions: one tool call per turn</text>
<text x="2.200" y="4.600" font-size="3.5278" fill="#1c2430" text-anchor="start" font-weight="bold" xml:space="preserve">a</text>
<rect x="4.000" y="24.000" width="20.000" height="8.298" rx="1.20" fill="#efe3f7" stroke="#9a5bd1" stroke-width="0.2822"/>
<text x="14.000" y="27.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Agent</text>
<text x="14.000" y="31.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">LLM</text>
<rect x="31.000" y="9.000" width="30.000" height="7.919" rx="1.20" fill="#ffffff" stroke="#5b6878" stroke-width="0.2822"/>
<text x="46.000" y="12.049" font-size="2.1167" fill="#1c2430" text-anchor="middle" xml:space="preserve">turn 1: {"tool": "lookup",</text>
<text x="46.000" y="14.758" font-size="2.1167" fill="#1c2430" text-anchor="middle" xml:space="preserve">"arg": "city 1"}</text>
<rect x="31.000" y="22.000" width="30.000" height="7.919" rx="1.20" fill="#ffffff" stroke="#5b6878" stroke-width="0.2822"/>
<text x="46.000" y="25.049" font-size="2.1167" fill="#1c2430" text-anchor="middle" xml:space="preserve">turn 2: {"tool": "lookup",</text>
<text x="46.000" y="27.758" font-size="2.1167" fill="#1c2430" text-anchor="middle" xml:space="preserve">"arg": "city 2"}</text>
<rect x="31.000" y="35.000" width="30.000" height="7.919" rx="1.20" fill="#ffffff" stroke="#5b6878" stroke-width="0.2822"/>
<text x="46.000" y="38.049" font-size="2.1167" fill="#1c2430" text-anchor="middle" xml:space="preserve">turn 3: {"tool": "lookup",</text>
<text x="46.000" y="40.758" font-size="2.1167" fill="#1c2430" text-anchor="middle" xml:space="preserve">"arg": "city 3"}</text>
<rect x="68.000" y="24.000" width="19.000" height="11.098" rx="1.20" fill="#DEE4F0" stroke="#1F72AE" stroke-width="0.2822"/>
<text x="77.500" y="27.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Tools</text>
<text x="77.500" y="31.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">one result</text>
<text x="77.500" y="33.848" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">per turn</text>
<polyline points="24.000,28.149 27.500,28.149 27.500,12.959 29.500,12.959" fill="none" stroke="#1c2430" stroke-width="0.1764" stroke-linejoin="round"/>
