<polyline points="61.000,12.959 64.500,12.959 64.500,29.549 66.500,29.549" fill="none" stroke="#1c2430" stroke-width="0.1764" stroke-linejoin="round"/>
<polygon points="67.700,29.549 66.200,30.169 66.200,28.929" fill="#1c2430"/>
<polyline points="24.000,28.149 27.500,28.149 27.500,25.959 29.500,25.959" fill="none" stroke="#1c2430" stroke-width="0.1764" stroke-linejoin="round"/>
<polygon points="30.700,25.959 29.200,26.579 29.200,25.339" fill="#1c2430"/>
<polyline points="61.000,25.959 64.500,25.959 64.500,29.549 66.500,29.549" fill="none" stroke="#1c2430" stroke-width="0.1764" stroke-linejoin="round"/>
<polygon points="67.700,29.549 66.200,30.169 66.200,28.929" fill="#1c2430"/>
<polyline points="24.000,28.149 27.500,28.149 27.500,38.959 29.500,38.959" fill="none" stroke="#1c2430" stroke-width="0.1764" stroke-linejoin="round"/>
<polygon points="30.700,38.959 29.200,39.579 29.200,38.339" fill="#1c2430"/>
