<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="89.000mm" viewBox="0 0 183.000 89.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>neuro-symbolic-loop</title>
<desc>Neuro-symbolic proof loop: a symbolic engine deduces facts from the premises; if the goal is not reached, a language model trained on synthetic proofs proposes one auxiliary object, which is added to the premises, and deduction runs again. Geometry labels are generic. Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
<rect id="background" x="0" y="0" width="183.000" height="89.000" fill="#FFFFFF"/>
<g id="training">
<rect x="2.000" y="3.000" width="52.000" height="83.000" rx="1.800" fill="#F7F7F7" stroke="#B4B2CF" stroke-width="0.1764"/>
<text x="4.000" y="6.600" font-size="2.6458" fill="#43406F" text-anchor="start" font-weight="bold" xml:space="preserve">Training data (offline)</text>
<rect x="5.000" y="10.000" width="46.000" height="20.000" rx="1.200" fill="#E8E7F0" stroke="#595594" stroke-width="0.2822"/>
<text x="28.000" y="17.841" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">1  Random premises</text>
<text x="28.000" y="21.139" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">sample points, lines and</text>
<text x="28.000" y="23.937" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">relations at random</text>
<rect x="5.000" y="37.000" width="46.000" height="20.000" rx="1.200" fill="#E8E7F0" stroke="#595594" stroke-width="0.2822"/>
<text x="28.000" y="44.841" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">2  Deduce</text>
<text x="28.000" y="48.139" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">the symbolic engine derives</text>
<text x="28.000" y="50.937" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">every fact it can reach</text>
<rect x="5.000" y="64.000" width="46.000" height="20.000" rx="1.200" fill="#E8E7F0" stroke="#595594" stroke-width="0.2822"/>
<text x="28.000" y="70.443" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">3  Trace back</text>
<text x="28.000" y="73.740" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">objects a proof needs beyond</text>
<text x="28.000" y="76.538" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">its statement become the</text>
<text x="28.000" y="79.335" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">targets the model learns</text>
<polyline points="28.000,30.000 28.000,35.937" fill="none" stroke="#43406F" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="28.000,37.000 27.368,35.482 28.000,35.862 28.632,35.482" fill="#43406F"/>
<polyline points="28.000,57.000 28.000,62.937" fill="none" stroke="#43406F" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="28.000,64.000 27.368,62.482 28.000,62.862 28.632,62.482" fill="#43406F"/>
</g>
