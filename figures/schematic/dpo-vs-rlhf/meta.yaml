when_to_use: "对比两种偏好对齐流程：上行 RLHF 三阶段（SFT → 奖励模型 → 强化学习，如 PPO），每步下方注明用到的数据；下行 DPO 从同一个 SFT 模型出发，用同一批偏好对直接做一个分类式损失（相对冻结参考模型），一张卡替代奖励模型和 RL 两步，不在训练中采样。与 #55 的 `rlhf-three-steps`（只画 RLHF 三步）不同，本图重点是两条路径的对照。"
customize: "改 `build.py` 底部 figure 段里的坐标、卡片文字和颜色（`HOUSE` 色板及 `tint()`/`dark()` 派生色）后运行 `python3 build.py <新的空目录>` 生成 figure.svg、template.drawio 和 preview.png（脚本只写新文件，目标目录已有同名文件时拒绝运行，不会覆盖）；也可直接在 draw.io 打开 `template.drawio` 或在 Inkscape 等编辑器改 `figure.svg`（文字是可编辑矢量文字）。脚本在文字出画布或出框、文字重叠、游离标签压到框线、连线穿过文字、小于 6 pt、线宽超出 0.5-1.6 pt 或文字对比度低于 4.5:1 时报错退出。"
