<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="89.000mm" viewBox="0 0 183.000 89.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>dpo-vs-rlhf</title>
<desc>RLHF versus DPO. RLHF trains a supervised model, fits a reward model to preference pairs and then optimises the policy with reinforcement learning; DPO starts from the same supervised model and fits the policy directly to the same preference pairs with a single classification-style loss. Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
