<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="89.000mm" viewBox="0 0 183.000 89.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>hypothesis-experiment-loop</title>
<desc>Hypothesis-experiment loop: AI agents propose and rank candidates, people run the assay, an analysis agent interprets the data and the next round starts from the new evidence. Disease and assay names are generic placeholders. Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
