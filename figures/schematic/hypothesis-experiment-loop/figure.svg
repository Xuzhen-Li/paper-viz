<text x="115.000" y="64.643" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">3  Experiment</text>
<text x="115.000" y="67.940" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">scientists run the</text>
<text x="115.000" y="70.738" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">assay (e.g. a cell</text>
<text x="115.000" y="73.535" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">screen), return data</text>
<rect x="47.000" y="50.000" width="40.000" height="30.000" rx="1.200" fill="#DEF1EC" stroke="#119B76" stroke-width="0.2822"/>
<rect x="64.750" y="59.215" width="1.170" height="2.250" rx="0.000" fill="#0D7458" stroke="none" stroke-width="0.2822"/>
<rect x="66.370" y="57.465" width="1.170" height="4.000" rx="0.000" fill="#0D7458" stroke="none" stroke-width="0.2822"/>
<rect x="67.990" y="58.465" width="1.170" height="3.000" rx="0.000" fill="#0D7458" stroke="none" stroke-width="0.2822"/>
<polyline points="64.450,61.465 69.550,61.465" fill="none" stroke="#0D7458" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<text x="67.000" y="64.643" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">4  Interpret</text>
<text x="67.000" y="67.940" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">data-analysis agent</text>
<text x="67.000" y="70.738" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">analyses the data and</text>
<text x="67.000" y="73.535" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">updates the evidence</text>
<polyline points="87.000,27.000 93.699,27.000" fill="none" stroke="#1A1A1A" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
