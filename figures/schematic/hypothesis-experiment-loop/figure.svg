<text x="67.000" y="26.643" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">1  Hypothesize</text>
<text x="67.000" y="29.940" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">literature agent proposes</text>
<text x="67.000" y="32.738" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">mechanisms and</text>
<text x="67.000" y="35.535" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">candidate treatments</text>
<rect x="95.000" y="12.000" width="40.000" height="30.000" rx="1.200" fill="#E8E7F0" stroke="#595594" stroke-width="0.2822"/>
<polyline points="113.250,20.965 114.500,22.465 117.000,19.215" fill="none" stroke="#43406F" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<text x="115.000" y="26.643" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">2  Select</text>
<text x="115.000" y="29.940" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">LLM judge ranks the</text>
<text x="115.000" y="32.738" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">candidates pairwise;</text>
<text x="115.000" y="35.535" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">top few go to the lab</text>
