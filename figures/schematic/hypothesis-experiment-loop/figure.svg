<text x="21.000" y="68.339" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">papers, reviews,</text>
<text x="21.000" y="71.137" font-size="2.2931" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">assay methods</text>
</g>
<g id="loop">
