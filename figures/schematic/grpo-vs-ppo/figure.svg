<text x="103.000" y="22.909" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Reward model</text>
<text x="103.000" y="26.548" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">frozen, score r</text>
