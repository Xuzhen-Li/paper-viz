<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="66.000mm" viewBox="0 0 183.000 66.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>grpo-vs-ppo</title>
<desc>Schematic: PPO versus GRPO for reinforcement learning of language models. Layout type only; labels invented.</desc>
<rect x="0" y="0" width="183.000" height="66.000" fill="#ffffff"/>
<g id="zone-ppo">
<rect x="1.000" y="1.000" width="181.000" height="31.000" rx="1.60" fill="#f2f4f7" stroke="#c9ced6" stroke-width="0.1764"/>
<text x="91.500" y="4.600" font-size="2.6811" fill="#1F72AE" text-anchor="middle" font-weight="bold" xml:space="preserve">PPO: advantage from a learned value model</text>
<text x="2.200" y="4.600" font-size="3.5278" fill="#1c2430" text-anchor="start" font-weight="bold" xml:space="preserve">a</text>
</g>
<g id="zone-grpo">
<rect x="1.000" y="34.000" width="181.000" height="31.000" rx="1.60" fill="#f2f4f7" stroke="#c9ced6" stroke-width="0.1764"/>
<text x="91.500" y="37.600" font-size="2.6811" fill="#2e7d32" text-anchor="middle" font-weight="bold" xml:space="preserve">GRPO: advantage from a group of sampled outputs (no value model)</text>
<text x="2.200" y="37.600" font-size="3.5278" fill="#1c2430" text-anchor="start" font-weight="bold" xml:space="preserve">b</text>
</g>
