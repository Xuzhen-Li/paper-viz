<text x="103.000" y="10.909" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Reference model</text>
<text x="103.000" y="14.548" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">frozen, KL term</text>
