<rect x="63.000" y="13.000" width="18.000" height="5.499" rx="1.20" fill="#ffffff" stroke="#5b6878" stroke-width="0.2822"/>
<text x="72.000" y="16.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Output o</text>
