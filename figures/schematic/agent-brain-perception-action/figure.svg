<text x="113.000" y="26.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Reasoning + planning</text>
<text x="113.000" y="30.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">decompose, reflect</text>
<rect x="50.000" y="38.000" width="83.000" height="8.298" rx="1.20" fill="#efe3f7" stroke="#9a5bd1" stroke-width="0.2822"/>
<text x="91.500" y="41.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Decision</text>
<text x="91.500" y="45.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">choose next tool call, message or move</text>
</g>
