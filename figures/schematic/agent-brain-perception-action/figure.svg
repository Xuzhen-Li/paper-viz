<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="66.000mm" viewBox="0 0 183.000 66.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>agent-brain-perception-action</title>
<desc>Schematic: conceptual LLM agent with perception, brain and action modules in a loop with the environment. Layout type only.</desc>
<rect x="0" y="0" width="183.000" height="66.000" fill="#ffffff"/>
<g id="zone-perception">
<rect x="1.000" y="1.000" width="43.000" height="53.000" rx="1.60" fill="#f2f4f7" stroke="#c9ced6" stroke-width="0.1764"/>
<text x="22.500" y="4.600" font-size="2.6811" fill="#2aa198" text-anchor="middle" font-weight="bold" xml:space="preserve">Perception</text>
<text x="2.200" y="4.600" font-size="3.5278" fill="#1c2430" text-anchor="start" font-weight="bold" xml:space="preserve">a</text>
</g>
<g id="zone-brain">
<rect x="47.000" y="1.000" width="89.000" height="53.000" rx="1.60" fill="#f2f4f7" stroke="#c9ced6" stroke-width="0.1764"/>
<text x="91.500" y="4.600" font-size="2.6811" fill="#1F72AE" text-anchor="middle" font-weight="bold" xml:space="preserve">Brain (LLM)</text>
<text x="48.200" y="4.600" font-size="3.5278" fill="#1c2430" text-anchor="start" font-weight="bold" xml:space="preserve">b</text>
</g>
