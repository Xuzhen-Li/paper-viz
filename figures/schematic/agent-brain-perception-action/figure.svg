<text x="160.500" y="15.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">answers, plans</text>
<rect x="142.000" y="23.000" width="37.000" height="8.298" rx="1.20" fill="#fde8d4" stroke="#e08a3a" stroke-width="0.2822"/>
<text x="160.500" y="26.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Tool use</text>
<text x="160.500" y="30.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">search, code, lab APIs</text>
<rect x="142.000" y="38.000" width="37.000" height="8.298" rx="1.20" fill="#fde8d4" stroke="#e08a3a" stroke-width="0.2822"/>
<text x="160.500" y="41.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Embodied action</text>
<text x="160.500" y="45.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">robot, GUI clicks</text>
