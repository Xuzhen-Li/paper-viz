<text x="113.000" y="11.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">Knowledge</text>
<text x="113.000" y="15.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">world, common sense</text>
