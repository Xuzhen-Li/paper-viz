<svg xmlns="http://www.w3.org/2000/svg" width="183.000mm" height="52.000mm" viewBox="0 0 183.000 52.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>sop-role-pipeline</title>
<desc>Schematic: role-based multi-agent pipeline with a shared message pool. Layout type only; roles generic.</desc>
<rect x="0" y="0" width="183.000" height="52.000" fill="#ffffff"/>
<g id="frame">
