<text x="126.500" y="17.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">writes: code</text>
<rect x="147.000" y="10.000" width="30.000" height="8.298" rx="1.20" fill="#F6DEDE" stroke="#CC312C" stroke-width="0.2822"/>
<text x="162.000" y="13.409" font-size="2.3989" fill="#1c2430" text-anchor="middle" font-weight="bold" xml:space="preserve">QA engineer</text>
<text x="162.000" y="17.048" font-size="2.1872" fill="#1c2430" text-anchor="middle" xml:space="preserve">writes: tests, bug report</text>
</g>
