<polyline points="91.061,12.927 91.626,12.361" fill="none" stroke="#B95E0E" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<ellipse cx="90.000" cy="13.988" rx="1.500" ry="1.500" fill="#FFFFFF" stroke="#B95E0E" stroke-width="0.2822"/>
<ellipse cx="90.000" cy="13.988" rx="0.570" ry="0.570" fill="#FFFFFF" stroke="#B95E0E" stroke-width="0.2822"/>
<text x="90.000" y="19.265" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">2  Execute</text>
<text x="90.000" y="22.348" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">run each call c on</text>
<text x="90.000" y="24.930" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">its tool (e.g. QA,</text>
<text x="90.000" y="27.513" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">calculator) → result r</text>
<rect x="112.000" y="2.000" width="30.000" height="35.000" rx="1.200" fill="#DEF1EC" stroke="#119B76" stroke-width="0.2822"/>
<polyline points="125.250,13.988 126.500,15.488 129.000,12.238" fill="none" stroke="#0D7458" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<text x="127.000" y="19.265" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">3  Filter</text>
<text x="127.000" y="22.348" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">keep c only if</text>
<text x="127.000" y="24.930" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">inserting c → r lowers</text>
<text x="127.000" y="27.513" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">the loss on later tokens</text>
<rect x="149.000" y="2.000" width="30.000" height="35.000" rx="1.200" fill="#E8E7F0" stroke="#595594" stroke-width="0.2822"/>
<rect x="162.100" y="11.488" width="3.800" height="5.000" rx="0.400" fill="#FFFFFF" stroke="#43406F" stroke-width="0.2822"/>
<polyline points="162.860,12.888 165.140,12.888" fill="none" stroke="#43406F" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="162.860,13.888 165.140,13.888" fill="none" stroke="#43406F" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="162.860,14.888 165.140,14.888" fill="none" stroke="#43406F" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<text x="164.000" y="19.265" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Augmented x*</text>
<text x="164.000" y="22.348" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">x with the kept</text>
<text x="164.000" y="24.930" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">calls written inline</text>
<text x="164.000" y="27.513" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">as [c → r]</text>
<polyline points="31.600,19.500 36.099,19.500" fill="none" stroke="#1A1A1A" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="37.400,19.500 35.541,20.275 36.006,19.500 35.541,18.725" fill="#1A1A1A"/>
<polyline points="68.600,19.500 73.099,19.500" fill="none" stroke="#1A1A1A" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="74.400,19.500 72.541,20.275 73.006,19.500 72.541,18.725" fill="#1A1A1A"/>
<polyline points="105.600,19.500 110.099,19.500" fill="none" stroke="#1A1A1A" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="111.400,19.500 109.541,20.275 110.006,19.500 109.541,18.725" fill="#1A1A1A"/>
<polyline points="142.600,19.500 147.099,19.500" fill="none" stroke="#1A1A1A" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polygon points="148.400,19.500 146.541,20.275 147.006,19.500 146.541,18.725" fill="#1A1A1A"/>
</g>
<g id="fine-tune">
<rect x="112.000" y="42.000" width="68.000" height="9.000" rx="1.200" fill="#E8E7F0" stroke="#595594" stroke-width="0.2822"/>
<text x="146.000" y="47.389" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Fine-tune the same LM on all x*</text>
