<svg xmlns="http://www.w3.org/2000/svg" width="181.000mm" height="89.000mm" viewBox="0 0 181.000 89.000" font-family="Arial, 'Liberation Sans', Helvetica, sans-serif">
<title>tool-call-filter</title>
<desc>Self-supervised annotation of tool calls in three steps: sample candidate API calls with the LM, execute them, keep only calls whose result lowers the LM loss on the following tokens by at least a threshold, then fine-tune the LM on the augmented text. Example values are illustrative. Script-drawn schematic: layout, text and icons are generated by build.py as vector shapes (no bitmaps, no AI-generated icons).</desc>
<rect id="background" x="0" y="0" width="181.000" height="89.000" fill="#FFFFFF"/>
<g id="pipeline">
<rect x="1.000" y="2.000" width="30.000" height="35.000" rx="1.200" fill="#E8E8E8" stroke="#595959" stroke-width="0.2822"/>
<rect x="14.100" y="11.488" width="3.800" height="5.000" rx="0.400" fill="#FFFFFF" stroke="#434343" stroke-width="0.2822"/>
<polyline points="14.860,12.888 17.140,12.888" fill="none" stroke="#434343" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="14.860,13.888 17.140,13.888" fill="none" stroke="#434343" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="14.860,14.888 17.140,14.888" fill="none" stroke="#434343" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<text x="16.000" y="19.265" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">Input text x</text>
