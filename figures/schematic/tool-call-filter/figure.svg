<polygon points="164.000,41.400 163.225,39.541 164.000,40.006 164.775,39.541" fill="#1A1A1A"/>
</g>
<g id="example">
<rect x="1.000" y="40.000" width="108.000" height="47.000" rx="1.800" fill="#F7F7F7" stroke="#BFBFBF" stroke-width="0.1764"/>
<text x="3.000" y="43.600" font-size="2.6458" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">Example: candidates at one position i (illustrative values)</text>
<text x="4.000" y="50.400" font-size="2.1167" fill="#595959" text-anchor="start" font-weight="bold" xml:space="preserve">candidate call c</text>
<text x="44.000" y="50.400" font-size="2.1167" fill="#595959" text-anchor="start" font-weight="bold" xml:space="preserve">result r</text>
<text x="70.000" y="50.400" font-size="2.1167" fill="#595959" text-anchor="start" font-weight="bold" xml:space="preserve">gain</text>
<text x="84.000" y="50.400" font-size="2.1167" fill="#595959" text-anchor="start" font-weight="bold" xml:space="preserve">decision (τ = 0.5)</text>
<polyline points="3.000,52.400 107.000,52.400" fill="none" stroke="#BFBFBF" stroke-width="0.1764" stroke-linejoin="round" stroke-linecap="butt"/>
<rect x="2.400" y="54.600" width="105.200" height="6.200" rx="0.600" fill="#DEF1EC" stroke="#119B76" stroke-width="0.2822"/>
<text x="4.000" y="58.462" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">QA("Where is A?")</text>
<text x="44.000" y="58.462" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">"A is in B"</text>
<text x="70.000" y="58.462" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">0.8</text>
<polyline points="84.550,57.700 85.300,58.600 86.800,56.650" fill="none" stroke="#0D7458" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<text x="88.400" y="58.462" font-size="2.1167" fill="#0D7458" text-anchor="start" font-weight="bold" xml:space="preserve">keep</text>
<rect x="2.400" y="62.000" width="105.200" height="6.200" rx="0.600" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="0.1764"/>
<text x="4.000" y="65.862" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">QA("What is A?")</text>
<text x="44.000" y="65.862" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">"A is a place"</text>
<text x="70.000" y="65.862" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">0.2</text>
<polyline points="84.640,64.140 86.560,66.060" fill="none" stroke="#595959" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="84.640,66.060 86.560,64.140" fill="none" stroke="#595959" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<text x="88.400" y="65.862" font-size="2.1167" fill="#595959" text-anchor="start" xml:space="preserve">drop</text>
<rect x="2.400" y="69.400" width="105.200" height="6.200" rx="0.600" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="0.1764"/>
<text x="4.000" y="73.262" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">Calc(400 / 1400)</text>
<text x="44.000" y="73.262" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">0.29</text>
<text x="70.000" y="73.262" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">−0.1</text>
<polyline points="84.640,71.540 86.560,73.460" fill="none" stroke="#595959" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="84.640,73.460 86.560,71.540" fill="none" stroke="#595959" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="round"/>
<text x="88.400" y="73.262" font-size="2.1167" fill="#595959" text-anchor="start" xml:space="preserve">drop</text>
<text x="4.000" y="81.124" font-size="2.1167" fill="#595959" text-anchor="start" xml:space="preserve">gain = L(without) − L(with), see the filter rule; only the kept</text>
<text x="4.000" y="83.706" font-size="2.1167" fill="#595959" text-anchor="start" xml:space="preserve">call is written into x*</text>
</g>
<g id="rule">
<rect x="112.000" y="55.000" width="68.000" height="32.000" rx="1.800" fill="#F7F7F7" stroke="#94D2C1" stroke-width="0.1764"/>
<text x="114.000" y="58.600" font-size="2.6458" fill="#0D7458" text-anchor="start" font-weight="bold" xml:space="preserve">Filter rule (step 3)</text>
<text x="114.500" y="63.724" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">L(with): LM loss on the tokens after i</text>
<text x="114.500" y="66.306" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">   when c → r is inserted at i</text>
<text x="114.500" y="68.889" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">L(without): the lower loss of no call</text>
<text x="114.500" y="71.471" font-size="2.1167" fill="#1A1A1A" text-anchor="start" xml:space="preserve">   and c inserted without its result</text>
<text x="114.500" y="80.000" font-size="2.2931" fill="#1A1A1A" text-anchor="start" font-weight="bold" xml:space="preserve">keep c if L(without) − L(with) ≥ τ</text>
</g>
</svg>
