<text x="16.000" y="24.930" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">unlabelled text</text>
<text x="16.000" y="27.513" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">corpus</text>
<rect x="38.000" y="2.000" width="30.000" height="35.000" rx="1.200" fill="#E0EBF4" stroke="#1F72AE" stroke-width="0.2822"/>
<polyline points="51.880,11.488 51.880,16.488" fill="none" stroke="#175682" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="50.500,12.867 55.500,12.867" fill="none" stroke="#175682" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="53.000,11.488 53.000,16.488" fill="none" stroke="#175682" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="50.500,13.988 55.500,13.988" fill="none" stroke="#175682" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="54.120,11.488 54.120,16.488" fill="none" stroke="#175682" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="50.500,15.107 55.500,15.107" fill="none" stroke="#175682" stroke-width="0.2822" stroke-linejoin="round" stroke-linecap="butt"/>
<rect x="51.000" y="11.988" width="4.000" height="4.000" rx="0.500" fill="#FFFFFF" stroke="#175682" stroke-width="0.2822"/>
<rect x="52.120" y="13.107" width="1.760" height="1.760" rx="0.200" fill="#175682" stroke="none" stroke-width="0.2822"/>
<text x="53.000" y="19.265" font-size="2.4694" fill="#1A1A1A" text-anchor="middle" font-weight="bold" xml:space="preserve">1  Sample</text>
<text x="53.000" y="22.348" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">the LM, shown a few</text>
<text x="53.000" y="24.930" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">demos, proposes API</text>
<text x="53.000" y="27.513" font-size="2.1167" fill="#1A1A1A" text-anchor="middle" xml:space="preserve">calls c at positions i</text>
<rect x="75.000" y="2.000" width="30.000" height="35.000" rx="1.200" fill="#FEEDDE" stroke="#F77E12" stroke-width="0.2822"/>
<polyline points="91.500,13.988 92.300,13.988" fill="none" stroke="#B95E0E" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="91.061,15.048 91.626,15.614" fill="none" stroke="#B95E0E" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
<polyline points="90.000,15.488 90.000,16.288" fill="none" stroke="#B95E0E" stroke-width="0.4233" stroke-linejoin="round" stroke-linecap="butt"/>
