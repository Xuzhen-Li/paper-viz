title: Forest plot
title_zh: 森林图
slug: forest
category: clinical
tags:
  - forest
  - hazard-ratio
  - confidence-interval
packages:
  - ggplot2
data_columns:
  study: 研究或亚组名（字符串，行顺序即从上到下的反向）
  hr: 风险比（数值，大于 0）
  ci_low: 95% 区间下限（数值）
  ci_high: 95% 区间上限（数值）
when_to_use: 多个研究或亚组要并列展示效应量和区间时用。
customize: '在 `plot.R` 调整 `show_values` 开关（默认值为 `TRUE`）以在区间上方显示数值，颜色取自 `pv_palette("house")`；并在 `data.csv` 填入 study、hr、ci_low 和 ci_high 列。'
lang: R
style: house
cells: 1x2
