# Simulated data. No published reference figure; layout follows the house grid in styles/r/theme_house.R.
title: GWAS page with a 4x1 Manhattan (house mosaic, 4x2)
title_zh: GWAS 拼版：4×1 曼哈顿图、区域图、基因型效应、等位基因频率（house 风格，4×2）
slug: house-mosaic-gwas
category: layout
tags:
  - multi-panel
  - mosaic
  - house-style
  - gwas
  - manhattan
packages:
  - ggplot2
  - patchwork
data_columns:
  chr: 染色体编号 1–19（data.csv、data_chr.csv）
  pos: 位置（Mb，data.csv）
  p: 关联 P 值（data.csv）
  r2: 与 chr 4 头号 SNP 的 r²，只在放大窗口内有值（data.csv）
  length_mb: 染色体长度（Mb，data_chr.csv）
  genotype: 头号 SNP 基因型 AA / AG / GG（data_genotype.csv）
  dti: 耐旱指数（data_genotype.csv）
  jitter: 原始点横向抖动 −1–1（data_genotype.csv）
  population: 群体（data_allele.csv）
  g_percent: 耐旱等位基因 G 的频率 %（data_allele.csv）
when_to_use: 双栏半页讲一个 GWAS：a 是通栏 4×1 曼哈顿图，b 为头号位点区域图（2×1，按 r² 着色并画基因模型），c 头号 SNP 的基因型效应（箱线 + 原始点），d 各群体等位基因频率（堆叠条）。
customize: page_cells = 4×2；lead_genes 给每个峰标候选基因，zoom 为 b 的窗口（Mb），thr 为全基因组阈值。stopifnot() 检查头号位点是 chr 4 的 VvNCED3、且就是 b 窗口里的最高点（与 house-mosaic-aba-kinetics 的 b 标题一致）。
lang: R
style: house
cells: 4x2
references_note: No published reference figure; layout follows the house grid rules in styles/r/theme_house.R.
