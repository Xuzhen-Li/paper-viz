# Simulated data. References are links only (URL + figure number); no text or images copied.
title: Small multiples with in-panel trends (house style)
title_zh: 小多图与面板内趋势（house 风格）
slug: house-small-multiples
category: layout
tags:
  - small-multiples
  - facet
  - trend
  - time-series
  - house-style
packages:
  - ggplot2
data_columns:
  region: 面板分组（字符串）
  year: 年份（x 轴）
  anomaly_c: 数值（此例为温度距平 °C）
when_to_use: 同一指标在多个地区或类别上并排比较时用；共享坐标轴、只在外侧写刻度，每个面板左上写名称和线性趋势 ± s.e.（含显著性星号），显著上升红色、下降蓝色、不显著灰色。
customize: plot.R 顶部 n_cols 为每行面板数；alpha_sig 为着色的显著性阈值。颜色取 pv_palette("house")；文字字号写成印刷 pt（pv_pt2size），每个小面板约占 1 格，整图 4×2 格（183 × 89 mm），面板间距 3 mm 与网格间隔一致；多面板字号保持 7/8 pt。
lang: R
style: house
cells: 4x2
references:
