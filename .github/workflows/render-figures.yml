name: render-figures

on:
  pull_request:
    paths:
      - "figures/**"
      - "styles/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/render-figures.yml"
  workflow_dispatch:
    inputs:
      render_all:
        description: "Render and check all figures"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: render-figures-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    # Only this job pushes (figure-only runs commit their own previews).
    permissions:
      contents: write
    steps:
      - name: Refuse fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Fork pull requests cannot receive commits from GITHUB_TOKEN. Open the pull request from a branch in this repository (Xuzhen-Li/paper-viz), not from a fork."
          exit 1

      - name: Checkout pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Select targets
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          RENDER_ALL: ${{ github.event.inputs.render_all }}
          # Only set for pull_request events; workflow_dispatch uses the checked-out ref.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          # step:select
          set -euo pipefail
          FIGFILE="${RUNNER_TEMP:-/tmp}/render-figure-dirs.txt"

          list_all_figures() {
            find figures -mindepth 2 -maxdepth 2 -type d -print | sort | while IFS= read -r d; do
              [ -f "$d/meta.yaml" ] || continue
              printf '%s\n' "$d"
            done
          }

          lang_of() {
            d="$1"
            f="$d/meta.yaml"
            if [ ! -f "$f" ]; then
              printf '%s\n' missing
              return 0
            fi
            if grep -Eq '^lang:[[:space:]]*drawio[[:space:]]*$' "$f"; then
              printf '%s\n' drawio
            elif [ -f "$d/plot.R" ] || [ -f "$d/make_data.R" ]; then
              printf '%s\n' R
            elif [ -f "$d/plot.py" ] || [ -f "$d/make_data.py" ]; then
              printf '%s\n' Python
            else
              printf '%s\n' unknown
            fi
          }

          choose_targets() {
            MODE=catalog_only
            CHECK_ALL=false
            NEED_R=false
            NEED_PY=false
            COMMIT=false
            FIGURES=""

            case "${RENDER_ALL:-}" in
              true|True|TRUE) RENDER_ALL=true ;;
              *) RENDER_ALL=false ;;
            esac

            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              # No pull request here: never read PR SHAs. Render what is checked out.
              echo "workflow_dispatch on ${GITHUB_REF_NAME:-?} at ${RUN_SHA:-$(git rev-parse HEAD 2>/dev/null || echo unknown)} (render_all=$RENDER_ALL)"
              if [ "$RENDER_ALL" = true ]; then
                MODE=all
                CHECK_ALL=true
                FIGURES="$(list_all_figures)"
              fi
            elif [ "$EVENT_NAME" = "pull_request" ]; then
              if [ "${SELECT_LIB_ONLY:-}" = 1 ]; then
                CHANGED="${CHANGED_FILES-}"
              else
                if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
                  echo "::error::pull request is missing base or head SHA"
                  exit 1
                fi
                git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$BASE_SHA"
                git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$HEAD_SHA"
                CHANGED="$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")"
              fi
              printf '%s\n' "Changed files:"
              printf '%s\n' "$CHANGED"

              FORCE_ALL=false
              if printf '%s\n' "$CHANGED" | grep -Eq '^(styles|tests)/'; then
                FORCE_ALL=true
              fi
              if printf '%s\n' "$CHANGED" | grep -Eq '^tools/(check_figure\.sh|check_png_grid\.sh|blocklist\.txt|check_all\.sh|build_catalog\.py|r-packages\.txt)$'; then
                FORCE_ALL=true
              fi
              # A change to this workflow (fonts, R setup, render logic) is checked by a full render.
              if printf '%s\n' "$CHANGED" | grep -Eq '^\.github/workflows/render-figures\.yml$'; then
                FORCE_ALL=true
              fi

              FIG_DIRS="$(printf '%s\n' "$CHANGED" | grep -E '^figures/[^/]+/[^/]+/' | sed -E 's|^(figures/[^/]+/[^/]+)/.*|\1|' | sort -u || true)"

              if [ "$FORCE_ALL" = true ]; then
                # Full render is check-only: never commit previews/docs/catalog.
                MODE=all
                FIGURES="$(list_all_figures)"
                echo "::notice::styles/, tests/, check tooling or this workflow changed: rendering all figures as a check only; nothing will be committed."
                if [ -n "$FIG_DIRS" ]; then
                  echo "::notice::Figure directories also changed in this pull request. Their previews are NOT auto-committed in a check-only run; commit them by hand or via a later figure-only push."
                fi
              elif [ -n "$FIG_DIRS" ]; then
                MODE=selected
                COMMIT=true
                FIGURES="$FIG_DIRS"
              else
                MODE=catalog_only
                FIGURES=""
              fi
            fi

            if [ -n "$FIGURES" ]; then
              printf '%s\n' "$FIGURES" > "$FIGFILE"
            else
              : > "$FIGFILE"
            fi

            if [ -s "$FIGFILE" ]; then
              while IFS= read -r d; do
                [ -n "$d" ] || continue
                case "$(lang_of "$d")" in
                  R)
                    NEED_R=true
                    if [ -f "$d/plot.py" ] || [ -f "$d/make_data.py" ]; then
                      NEED_PY=true
                    fi
                    ;;
                  Python)
                    NEED_PY=true
                    ;;
                esac
              done < "$FIGFILE"
            fi

            echo "mode=$MODE" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "need_r=$NEED_R" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "need_py=$NEED_PY" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "check_all=$CHECK_ALL" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "commit=$COMMIT" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "figure_count=$(grep -c . "$FIGFILE" || true)" >> "${GITHUB_OUTPUT:-/dev/null}"
            echo "Selection mode=$MODE need_r=$NEED_R need_py=$NEED_PY check_all=$CHECK_ALL commit=$COMMIT"
            cat "$FIGFILE" || true
          }

          if [ "${SELECT_LIB_ONLY:-}" != 1 ]; then
            choose_targets
          fi

      - name: Set R_LIBS_USER inside the workspace
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/.Rlib"
          echo "R_LIBS_USER=${GITHUB_WORKSPACE}/.Rlib" >> "$GITHUB_ENV"

      - name: Setup R
        id: setup-r
        if: steps.select.outputs.need_r == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Cache R packages
        if: steps.select.outputs.need_r == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.Rlib
          key: ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('tools/r-packages.txt') }}
          restore-keys: |
            ${{ runner.os }}-r-${{ steps.setup-r.outputs.installed-r-version }}-

      - name: Install system libraries for R
        if: steps.select.outputs.need_r == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gfortran cmake pkg-config \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev \
            libcairo2-dev libxt-dev \
            libglpk-dev libgmp-dev \
            libblas-dev liblapack-dev \
            fonts-dejavu-core

      - name: Install Arial-compatible fonts
        if: steps.select.outputs.need_r == 'true' || steps.select.outputs.need_py == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-liberation
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          # The installer downloads Arial from SourceForge and can fail without a non-zero exit;
          # rendering then falls back to Liberation Sans and commits previews with other text
          # widths. Retry, and stop the job if Arial is still missing.
          # If the package itself did not install (apt error), install it again; if it is
          # installed but the font download failed, dpkg-reconfigure repeats the download.
          # The EULA answer preseeded above is reused in both cases.
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then sleep 10; fi
            if [ "$(dpkg-query -W -f='${Status}' ttf-mscorefonts-installer 2>/dev/null || true)" = "install ok installed" ]; then
              sudo DEBIAN_FRONTEND=noninteractive dpkg-reconfigure ttf-mscorefonts-installer || true
            else
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ttf-mscorefonts-installer || true
            fi
            sudo fc-cache -f
            if [ "$(fc-match -f '%{family[0]}' Arial)" = "Arial" ]; then break; fi
            echo "::warning::Arial not installed (attempt $attempt)"
          done
          echo "fc-match Arial: $(fc-match Arial)"
          if [ "$(fc-match -f '%{family[0]}' Arial)" != "Arial" ]; then
            echo "::error::Arial could not be installed; refusing to render previews with a fallback font"
            exit 1
          fi
          echo "fc-match Helvetica: $(fc-match Helvetica)"

      - name: Install R packages from tools/r-packages.txt
        if: steps.select.outputs.need_r == 'true'
        run: |
          # step:r-install
          set -euo pipefail
          export R_LIBS_USER="${GITHUB_WORKSPACE}/.Rlib"
          mkdir -p "$R_LIBS_USER"
          Rscript - <<'RS'
          pkg_file <- "tools/r-packages.txt"
          if (!file.exists(pkg_file)) {
            message("::error::missing tools/r-packages.txt")
            quit(status = 1)
          }
          cran <- character()
          bioc <- character()
          pins <- list()
          section <- "CRAN"
          for (line in readLines(pkg_file, warn = FALSE)) {
            t <- trimws(line)
            if (!nzchar(t)) next
            if (startsWith(t, "#")) {
              # "# pin: <package> <version>" (a comment, so older parsers skip it)
              pin <- regmatches(t, regexec("^#\\s*pin:\\s*([A-Za-z][A-Za-z0-9.]*)\\s+([0-9][0-9.-]*)\\s*$", t))[[1]]
              if (length(pin) == 3) {
                pins[[pin[2]]] <- pin[3]
                next
              }
              if (grepl("Bioconductor", t, ignore.case = TRUE)) {
                section <- "Bioc"
              } else if (grepl("^#\\s*CRAN\\b", t, ignore.case = TRUE)) {
                section <- "CRAN"
              }
              next
            }
            if (identical(section, "Bioc")) bioc <- c(bioc, t) else cran <- c(cran, t)
          }
          lib <- Sys.getenv("R_LIBS_USER")
          if (!nzchar(lib)) {
            message("::error::R_LIBS_USER is unset")
            quit(status = 1)
          }
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          message("CRAN packages: ", paste(cran, collapse = ", "))
          message("Bioconductor packages: ", paste(bioc, collapse = ", "))
          message("Pinned: ", paste(names(pins), unlist(pins), sep = " ", collapse = ", "))
          # Pinned packages first, at the exact version; the rest must not upgrade them.
          if (length(pins)) {
            if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes", lib = lib)
            for (p in names(pins)) {
              have <- tryCatch(as.character(packageVersion(p, lib.loc = lib)), error = function(e) "")
              if (!identical(have, pins[[p]])) {
                message("installing ", p, " ", pins[[p]], " (have: ", if (nzchar(have)) have else "none", ")")
                remotes::install_version(p, version = pins[[p]], upgrade = "never", lib = lib)
              }
            }
          }
          check_pins <- function() {
            for (p in names(pins)) {
              have <- tryCatch(as.character(packageVersion(p)), error = function(e) "none")
              if (!identical(have, pins[[p]])) {
                message("::error::", p, " is ", have, ", pinned to ", pins[[p]], " in tools/r-packages.txt")
                quit(status = 1)
              }
            }
          }
          cran <- setdiff(cran, names(pins))
          report_missing <- function(pkgs) {
            missing <- pkgs[!vapply(pkgs, function(p) requireNamespace(p, quietly = TRUE), logical(1))]
            if (length(missing)) {
              for (pkg in missing) message("::error::R package install failed: ", pkg)
              quit(status = 1)
            }
          }
          if (length(cran)) {
            tryCatch(
              install.packages(cran, lib = lib),
              error = function(e) message(conditionMessage(e))
            )
            report_missing(cran)
          }
          if (length(bioc)) {
            if (!requireNamespace("BiocManager", quietly = TRUE)) {
              install.packages("BiocManager", lib = lib)
            }
            if (!requireNamespace("BiocManager", quietly = TRUE)) {
              message("::error::R package install failed: BiocManager")
              quit(status = 1)
            }
            tryCatch(
              BiocManager::install(bioc, ask = FALSE, update = FALSE, lib = lib),
              error = function(e) message(conditionMessage(e))
            )
            report_missing(bioc)
          }
          check_pins()
          RS

      - name: Setup Python
        if: steps.select.outputs.need_py == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python packages
        if: steps.select.outputs.need_py == 'true'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install matplotlib numpy pandas
          echo "PYTHON=$(command -v python)" >> "$GITHUB_ENV"

      - name: Render and check figures
        if: steps.select.outputs.mode == 'selected' || steps.select.outputs.mode == 'all'
        env:
          CHECK_ALL: ${{ steps.select.outputs.check_all }}
        run: |
          # step:render
          set -euo pipefail
          FIGFILE="${RUNNER_TEMP:-/tmp}/render-figure-dirs.txt"

          render_one() {
            dir="$1"
            py="${PYTHON:-python3}"
            echo "== render $dir =="
            if [ ! -d "$dir" ] || [ ! -f "$dir/meta.yaml" ]; then
              echo "skip missing figure: $dir"
              return 0
            fi
            if grep -Eq '^lang:[[:space:]]*drawio[[:space:]]*$' "$dir/meta.yaml"; then
              echo "drawio: check only $dir"
              bash tools/check_figure.sh "$dir" || return 1
              return 0
            fi
            (
              cd "$dir" || exit 1
              if [ -f make_data.R ]; then
                Rscript make_data.R || exit 1
              elif [ -f make_data.py ]; then
                "$py" make_data.py || exit 1
              else
                echo "no make_data script in $dir" >&2
                exit 1
              fi
              if [ -f plot.R ] && [ -f plot.py ]; then
                "$py" plot.py || exit 1
              fi
              if [ -f plot.R ]; then
                Rscript plot.R || exit 1
              elif [ -f plot.py ]; then
                "$py" plot.py || exit 1
              else
                echo "no plot script in $dir" >&2
                exit 1
              fi
              if [ ! -f preview.png ]; then
                echo "preview.png was not written in $dir" >&2
                exit 1
              fi
            ) || return 1
            bash tools/check_figure.sh "$dir" || return 1
          }

          if [ "${RENDER_LIB_ONLY:-}" = 1 ]; then
            return 0
          fi

          if [ -z "${GITHUB_WORKSPACE:-}" ]; then
            echo "::error::GITHUB_WORKSPACE is unset"
            exit 1
          fi
          export R_LIBS_USER="${GITHUB_WORKSPACE}/.Rlib"
          mkdir -p "$R_LIBS_USER"
          export PYTHON="${PYTHON:-python3}"

          if [ ! -f "$FIGFILE" ]; then
            echo "::error::figure list missing"
            exit 1
          fi

          fail=0
          while IFS= read -r dir; do
            [ -n "$dir" ] || continue
            render_one "$dir" || {
              echo "::error::failed $dir"
              fail=1
            }
          done < "$FIGFILE"

          if [ "${CHECK_ALL:-false}" = "true" ]; then
            echo "== check_all =="
            bash tools/check_all.sh || fail=1
          fi

          exit "$fail"

      - name: Record render environment
        if: ${{ !cancelled() && (steps.select.outputs.mode == 'selected' || steps.select.outputs.mode == 'all') }}
        env:
          NEED_R: ${{ steps.select.outputs.need_r }}
          NEED_PY: ${{ steps.select.outputs.need_py }}
        run: |
          # Versions behind this render, for comparing CI output with local renders.
          set -uo pipefail
          out="${RUNNER_TEMP}/render-artifacts"
          mkdir -p "$out"
          info="$out/session-info.txt"
          {
            echo "commit: ${GITHUB_SHA}  ref: ${GITHUB_REF}  run: ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
            echo "runner: ${ImageOS:-unknown} ${ImageVersion:-}"
            echo "fc-match Arial: $(fc-match Arial 2>/dev/null || echo n/a)"
            echo
          } > "$info"
          if [ "$NEED_R" = "true" ]; then
            export R_LIBS_USER="${GITHUB_WORKSPACE}/.Rlib"
            Rscript -e 'for (p in c("ggplot2", "ragg", "systemfonts", "textshaping", "patchwork")) suppressWarnings(requireNamespace(p, quietly = TRUE)); print(sessionInfo()); cat("\nInstalled packages:\n"); ip <- installed.packages()[, c("Package", "Version")]; write.table(ip[order(ip[, 1]), ], quote = FALSE, row.names = FALSE, col.names = FALSE)' >> "$info" 2>&1 \
              || echo "::warning::could not record R session info"
          fi
          if [ "$NEED_PY" = "true" ]; then
            { echo; echo "Python: $(python3 --version 2>&1)"; python3 -m pip freeze 2>/dev/null; } >> "$info"
          fi
          {
            echo "### Render environment"
            echo '```'
            grep -E '^(R version|Platform|Running under|fc-match|Python)|^(ggplot2|ragg|systemfonts|textshaping|matplotlib)( |==)' "$info" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect rendered figures
        if: ${{ !cancelled() && (steps.select.outputs.mode == 'selected' || steps.select.outputs.mode == 'all') }}
        run: |
          # Copy figure.pdf and preview.png of the figures rendered in this run; figure.pdf is
          # not committed, so this artifact is the only place to see the CI vector output.
          set -euo pipefail
          FIGFILE="${RUNNER_TEMP}/render-figure-dirs.txt"
          out="${RUNNER_TEMP}/render-artifacts"
          mkdir -p "$out"
          [ -f "$FIGFILE" ] || exit 0
          n=0
          while IFS= read -r dir; do
            case "$dir" in
              figures/*/*) ;;
              *) continue ;;
            esac
            for f in figure.pdf preview.png; do
              if [ -f "$dir/$f" ]; then
                mkdir -p "$out/$dir"
                cp -- "$dir/$f" "$out/$dir/$f"
                n=$((n + 1))
              fi
            done
          done < "$FIGFILE"
          echo "Collected $n file(s) for the render artifact."

      - name: Upload rendered figures
        if: ${{ !cancelled() && (steps.select.outputs.mode == 'selected' || steps.select.outputs.mode == 'all') }}
        uses: actions/upload-artifact@v7
        with:
          name: rendered-figures-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/render-artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build catalog
        run: |
          set -euo pipefail
          python3 tools/build_catalog.py

      - name: Report drift after full check
        if: ${{ !cancelled() && steps.select.outputs.mode == 'all' && steps.select.outputs.commit != 'true' }}
        run: |
          # step:drift
          # Report only, never commit. A full render is a check; runner fonts and
          # library versions can differ from the committed previews, so drift is a
          # warning plus a job summary, not a failure.
          set -euo pipefail
          paths=(figures docs catalog.json README.md)
          if git diff --quiet --exit-code -- "${paths[@]}"; then
            echo "No drift: rendered outputs match the committed files."
            echo "### Render drift: none" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          changed="$(git diff --name-only -- "${paths[@]}")"
          count="$(printf '%s\n' "$changed" | grep -c . || true)"
          echo "::warning::Full check: ${count} tracked file(s) differ from the commit. Report only; nothing is committed."
          printf '%s\n' "$changed" | head -n 9 | while IFS= read -r f; do
            echo "::warning file=${f}::drift after full render: ${f}"
          done
          printf '%s\n' "$changed"
          {
            echo "### Render drift: ${count} file(s)"
            echo ""
            echo "Full render is check-only; these files were NOT committed."
            echo ""
            echo '```'
            printf '%s\n' "$changed"
            echo '```'
            echo ""
            echo '```'
            git diff --stat -- "${paths[@]}" | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit previews and catalog
        if: steps.select.outputs.commit == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        run: |
          # step:commit
          set -euo pipefail

          refuse_unsafe_ref() {
            case "$TARGET_REF" in
              ""|-*|*[!A-Za-z0-9._/-]*|*/|*//*|*..*)
                echo "::error::Refusing to push to unsafe branch name"
                exit 1
                ;;
            esac
          }

          assert_staged_allowed() {
            bad=0
            while IFS= read -r -d '' f; do
              [ -n "$f" ] || continue
              case "$f" in
                figures/*/figure*.png|figures/*/figure*.pdf|figures/*/*/figure*.png|figures/*/*/figure*.pdf)
                  echo "::error::Refusing to commit figure.png or figure.pdf: $f"
                  bad=1
                  continue
                  ;;
              esac
              case "$f" in
                README.md|catalog.json|docs/catalog.json|docs/previews/*.png|figures/*/*/preview.png|figures/*/*/data*.csv)
                  ;;
                *)
                  echo "::error::Refusing to commit unexpected path: $f"
                  bad=1
                  ;;
              esac
            done < <(git diff --cached -z --name-only)
            [ "$bad" -eq 0 ]
          }

          stage_outputs() {
            # Only the figures selected for this run (their own dirs changed).
            # git add -A stages modifications, new files and deletions alike.
            FIGFILE="${RUNNER_TEMP:-/tmp}/render-figure-dirs.txt"
            git add -A -- README.md catalog.json docs/catalog.json
            [ -f "$FIGFILE" ] || return 0
            while IFS= read -r dir; do
              [ -n "$dir" ] || continue
              case "$dir" in
                figures/*/*) ;;
                *) continue ;;
              esac
              slug="$(sed -nE 's/^slug:[[:space:]]*["'"'"']?([^"'"'"'[:space:]]+)["'"'"']?[[:space:]]*$/\1/p' "$dir/meta.yaml" 2>/dev/null | head -n 1)"
              [ -n "$slug" ] || slug="$(basename "$dir")"
              # Tracked (including deleted) and untracked outputs of this figure only.
              git ls-files -z --cached --others --exclude-standard -- \
                ":(literal)$dir/preview.png" \
                ":(glob)$(printf '%s' "$dir" | sed 's/[][*?\\]/\\&/g')/data*.csv" \
                ":(literal)docs/previews/${slug}.png" |
                xargs -0 -r git --literal-pathspecs add -A --
            done < "$FIGFILE"
          }

          revert_tolerable_previews() {
            # Re-rendered previews that differ from the committed file only by rendering
            # noise (same size, < 0.01 % of pixels, every RGBA channel diff <= 2; or bytes
            # only) are restored, so the bot does not commit them. New files and real
            # changes are committed as usual.
            tol="tools/png_within_tolerance.py"
            if [ ! -f "$tol" ]; then
              echo "::notice::$tol not found; committing re-rendered previews without the pixel tolerance check."
              return 0
            fi
            tmp_old="${RUNNER_TEMP:-/tmp}/committed-preview.png"
            while IFS= read -r -d '' f; do
              [ -n "$f" ] || continue
              case "$f" in
                figures/*/*/preview.png|docs/previews/*.png) ;;
                *) continue ;;
              esac
              git show "HEAD:$f" > "$tmp_old" 2>/dev/null || continue
              set +e
              result="$(python3 "$tol" "$tmp_old" "$f")"
              code=$?
              set -e
              if [ "$code" -eq 0 ]; then
                git checkout -- "$f"
                echo "::notice file=${f}::not committed, rendering noise only: ${result#within tolerance: }"
              else
                echo "commit ${f}: ${result}"
              fi
            # Modified tracked files only; deletions and new files are always committed.
            done < <(git diff -z --name-only --diff-filter=M -- 'figures/*/*/preview.png' 'docs/previews/*.png')
            rm -f "$tmp_old"
          }

          refuse_fork() {
            if [ "${EVENT_NAME:-}" = "pull_request" ] && [ "${HEAD_REPO:-}" != "${GITHUB_REPOSITORY:-}" ]; then
              echo "::error::Fork pull requests cannot receive commits from GITHUB_TOKEN. Open the pull request from a branch in ${GITHUB_REPOSITORY}, not from a fork."
              return 1
            fi
            return 0
          }

          commit_outputs() {
            refuse_fork || return 1
            refuse_unsafe_ref
            revert_tolerable_previews
            stage_outputs
            if git diff --cached -z --name-only | grep -zqE '^figures/.*/figure[^/]*\.(png|pdf)$'; then
              echo "::error::Refusing to commit figure.png or figure.pdf"
              return 1
            fi
            assert_staged_allowed
            if git diff --cached --quiet; then
              echo "No changes to commit"
              return 0
            fi
            git config user.name "Xuzhen Li"
            git config user.email "193294039+Xuzhen-Li@users.noreply.github.com"
            git commit -m "ci: render changed figure previews"
            git push origin "HEAD:refs/heads/${TARGET_REF}"
          }

          if [ "${COMMIT_LIB_ONLY:-}" = 1 ]; then
            return 0
          fi

          commit_outputs
