name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --upgrade pip
          python -m pip install matplotlib numpy pandas

      - name: Python unit tests
        run: |
          set -euo pipefail
          if ! ls tests/test_*.py >/dev/null 2>&1; then
            echo "::notice::No tests/test_*.py found; skipping unit tests."
            exit 0
          fi
          python -m unittest discover -s tests -p 'test_*.py' -v

  r-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true

      - name: Install system libraries and fonts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev \
            libpng-dev libtiff-dev libjpeg-dev libwebp-dev \
            poppler-utils fontconfig fonts-liberation
          echo ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ttf-mscorefonts-installer \
            || echo "::warning::ttf-mscorefonts-installer failed; falling back to Liberation Sans"
          sudo fc-cache -f
          echo "fc-match Arial: $(fc-match Arial)"

      - name: Install R packages
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          pkgs <- c("ggplot2", "png", "ragg", "systemfonts", "patchwork", "ggrepel")
          # Same pins as the figure render: "# pin: <package> <version>" in tools/r-packages.txt.
          pins <- list()
          for (t in trimws(readLines("tools/r-packages.txt", warn = FALSE))) {
            pin <- regmatches(t, regexec("^#\\s*pin:\\s*([A-Za-z][A-Za-z0-9.]*)\\s+([0-9][0-9.-]*)\\s*$", t))[[1]]
            if (length(pin) == 3) pins[[pin[2]]] <- pin[3]
          }
          message("Pinned: ", paste(names(pins), unlist(pins), sep = " ", collapse = ", "))
          if (length(pins)) {
            install.packages("remotes")
            for (p in names(pins)) remotes::install_version(p, version = pins[[p]], upgrade = "never")
          }
          install.packages(setdiff(pkgs, names(pins)))
          for (p in names(pins)) {
            have <- tryCatch(as.character(packageVersion(p)), error = function(e) "none")
            if (!identical(have, pins[[p]])) {
              message("::error::", p, " is ", have, ", pinned to ", pins[[p]], " in tools/r-packages.txt")
              quit(status = 1)
            }
          }
          missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(missing)) {
            for (p in missing) message("::error::R package install failed: ", p)
            quit(status = 1)
          }
          RS

      - name: R house theme tests
        run: |
          set -euo pipefail
          Rscript tests/test_theme_house.R 2>&1 | tee "${RUNNER_TEMP}/r-tests.log"
          if grep -q '^skip bottom-edge' "${RUNNER_TEMP}/r-tests.log"; then
            echo "::error::PNG bottom-edge check was skipped; png/ragg must be installed."
            exit 1
          fi
          grep -q '^all R house-theme checks passed' "${RUNNER_TEMP}/r-tests.log"
