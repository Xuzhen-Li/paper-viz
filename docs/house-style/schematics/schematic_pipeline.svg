<text x="131.800" y="4.300" font-size="2.8222" fill="#000000" text-anchor="end" font-weight="bold" xml:space="preserve"><tspan>pv_save_house()</tspan></text>
<polyline points="88.000,5.900 133.000,5.900" fill="none" stroke="#F77E12" stroke-width="0.1764"/>
