<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paper-viz</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, sans-serif; background: #fff; color: #1a1a1a; }
  header, main { max-width: 1100px; margin: 0 auto; padding: 20px 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
  input, select { font: inherit; padding: 6px 8px; border: 1px solid #ccc; background: #fff; }
  input[type="search"] { min-width: min(100%, 240px); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  button.card { display: block; width: 100%; padding: 8px; border: 1px solid #e5e5e5; background: #fff; text-align: left; cursor: pointer; }
  button.card img { width: 100%; height: 120px; object-fit: contain; background: #fafafa; }
  button.card strong { display: block; margin-top: 6px; font-size: 0.92rem; }
  button.card span { color: #555; font-size: 0.8rem; }
  dialog { border: 1px solid #ddd; width: min(720px, calc(100% - 24px)); padding: 16px; }
  dialog img { max-width: 100%; height: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { border-bottom: 1px solid #eee; text-align: left; padding: 4px 6px; vertical-align: top; }
  pre { overflow: auto; background: #f6f6f6; padding: 10px; font-size: 12px; }
  a { color: #0b57d0; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>paper-viz</h1>
  <p>论文图库。点开一张图可看说明、列定义和出图代码。</p>
  <div class="tools">
    <input id="q" type="search" placeholder="搜索标题或标签" aria-label="搜索">
    <select id="cat" aria-label="分类"><option value="">全部分类</option></select>
    <select id="tag" aria-label="标签"><option value="">全部标签</option></select>
  </div>
</header>
<main><div id="grid" class="grid"></div></main>
<dialog id="dlg">
  <div class="row"><strong id="dlg-title"></strong><button id="close" type="button">关闭</button></div>
  <p id="dlg-when"></p>
  <img id="dlg-img" alt="">
  <h2>列</h2>
  <table id="dlg-cols"></table>
  <p id="dlg-links"></p>
  <h2>代码</h2>
  <pre id="dlg-code"></pre>
</dialog>
<script>
const state = { figures: [] };
const grid = document.querySelector("#grid");
const q = document.querySelector("#q");
const cat = document.querySelector("#cat");
const tag = document.querySelector("#tag");
const dlg = document.querySelector("#dlg");

function fillSelect(el, values) {
  const cur = el.value;
  el.innerHTML = el.querySelector("option").outerHTML;
  [...values].sort().forEach((v) => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v;
    el.appendChild(o);
  });
  el.value = cur;
}

function matches(fig) {
  const query = q.value.trim().toLowerCase();
  if (cat.value && fig.category !== cat.value) return false;
  if (tag.value && !fig.tags.includes(tag.value)) return false;
  if (!query) return true;
  const blob = [fig.title, fig.title_zh, fig.slug, fig.category, ...(fig.tags || [])].join(" ").toLowerCase();
  return blob.includes(query);
}

function render() {
  grid.innerHTML = "";
  state.figures.filter(matches).forEach((fig) => {
    const btn = document.createElement("button");
    btn.className = "card";
    btn.type = "button";
    btn.innerHTML = `<img alt="" src="${fig.docs_preview}"><strong></strong><span></span>`;
    btn.querySelector("strong").textContent = fig.title_zh;
    btn.querySelector("span").textContent = fig.title;
    btn.addEventListener("click", () => openFig(fig));
    grid.appendChild(btn);
  });
}

function openFig(fig) {
  document.querySelector("#dlg-title").textContent = `${fig.title_zh} / ${fig.title}`;
  document.querySelector("#dlg-when").textContent = fig.when_to_use;
  const img = document.querySelector("#dlg-img");
  img.src = fig.docs_preview;
  img.alt = fig.title;
  const table = document.querySelector("#dlg-cols");
  table.innerHTML = "<tr><th>列</th><th>含义</th></tr>";
  Object.entries(fig.data_columns).forEach(([k, v]) => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td></td><td></td>";
    tr.children[0].textContent = k;
    tr.children[1].textContent = v;
    table.appendChild(tr);
  });
  const links = document.querySelector("#dlg-links");
  links.innerHTML = "";
  const a1 = document.createElement("a");
  a1.href = fig.github_data;
  a1.textContent = "下载 data.csv";
  const a2 = document.createElement("a");
  a2.href = fig.github_code;
  a2.textContent = fig.lang === "Python" ? "下载 plot.py" : "下载 plot.R";
  links.append(a1, " · ", a2);
  document.querySelector("#dlg-code").textContent = fig.code_text || "";
  dlg.showModal();
}

document.querySelector("#close").addEventListener("click", () => dlg.close());
[q, cat, tag].forEach((el) => el.addEventListener("input", render));
cat.addEventListener("change", render);
tag.addEventListener("change", render);

fetch("catalog.json")
  .then((r) => r.json())
  .then((data) => {
    state.figures = data.figures || [];
    fillSelect(cat, new Set(state.figures.map((f) => f.category)));
    fillSelect(tag, new Set(state.figures.flatMap((f) => f.tags)));
    render();
  });
</script>
</body>
</html>
